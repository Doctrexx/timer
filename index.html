/* ── Aesthetic refinement: visual-only layer; timer logic and controls unchanged ── */
:root {
  --bg: #f4f5f0;
  --fg: #18221d;
  --mute: #78847c;
  --line: #dfe5dc;
  --surface: #e9eee7;
  --accent: #39785b;
  --accent-fg: #fffdf8;
}

  :root:not([data-theme="light"]) {
    --bg: #101713;
    --fg: #edf3ed;
    --mute: #9ba99f;
    --line: #2b3930;
    --surface: #1a251e;
    --accent: #8bc6a2;
    --accent-fg: #102017;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --fg: #edf3ed; --mute: #9ba99f;
  --line: #2b3930; --surface: #1a251e;
  --accent: #8bc6a2; --accent-fg: #102017;
}

}

  font-size: .61rem;
  font-weight: 600;
  letter-spacing: .22em;
}

  font-size: 1.05rem;
  letter-spacing: .015em;
  padding: .65rem .5rem;
  transition: border-color .2s, color .2s;
}

  padding: 4px;
  gap: 3px;
  border-color: var(--line);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
}

  height: 2.15rem;

}

  box-shadow: 0 2px 8px rgba(25, 55, 37, .14);
}

  position: relative;

}

  letter-spacing: -.075em;
  text-shadow: 0 8px 35px rgba(36, 72, 49, .06);
}

  gap: .65rem;
  font-size: .72rem;
  letter-spacing: .09em;
  text-transform: uppercase;
}

  padding: .4rem .8rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  font-size: .68rem;
}

  gap: .55rem;
  margin-top: .7rem;
  padding: .65rem .85rem;
  border: 1px solid var(--line);

}

  width: 3.7rem;
  height: 2.6rem;

}

  min-height: 2.65rem;

  padding-inline: 1.6rem;

  border-radius: 999px;

.sess { font-size: .73rem; }
.sess li { gap: .55rem; padding-block: .42rem; border-top-style: solid; }
.empty {
  padding: 2.5rem 1.25rem;
  border: 1px dashed var(--line);
  border-radius: 1rem;
  margin-top: 1.25rem;
  background: color-mix(in srgb, var(--surface) 35%, transparent);

}
.sheet-foot { border-top: 1px solid var(--line); }

  padding: .75rem 1.1rem;

/* ── Focus studio additions ── */
.utility-row { width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.eyebrow { color:var(--mute); font-size:.58rem; font-weight:600; letter-spacing:.2em; }

}

}

.chart-row { display:grid; grid-template-columns:1.6rem minmax(2rem,1fr) 4.6rem; align-items:center; gap:.55rem; margin:.45rem 0; }

.chart-value { color:var(--mute); text-align:right; font: .62rem var(--display); }

.streak-overview { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; padding:0 0 1rem; border-bottom:1px solid var(--line); }

.streak-icon { grid-row:span 2; display:grid; place-items:center; width:2rem; height:2rem; border-radius:50%; background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); }
.streak-stat strong { font:500 1.2rem var(--display); line-height:1.1; }

  content:""; position:absolute; z-index:-1; width:18rem; height:18rem; border-radius:50%;
  right:-8rem; top:18%; pointer-events:none;

.run { animation:rise-in .45s ease both; }

@media (max-width:760px) {
  .utility-row { align-items:flex-start; }
  .eyebrow { padding-top:.7rem; font-size:.5rem; }
  .utility-actions { gap:.3rem; }
  .utility-btn { padding:.5rem .65rem; font-size:.57rem; }

<title>Quiet Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one full-viewport column. Session name on top, an oversized thin-weight clock centred, a quiet row of small controls beneath it, History at the foot. */
:root {
  --bg: #F2F4F1;
  --fg: #13171A;
  --mute: #5D6862;
  --line: #D5DBD4;
  --surface: #E7EBE6;
  --accent: #1B7F5C;
  --accent-fg: #FFFFFF;
  --display: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1110; --fg: #E9EEEA; --mute: #8D9892; --line: #232E28; --surface: #161C19;
    --accent: #4CD3A0; --accent-fg: #06130E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1110; --fg: #E9EEEA; --mute: #8D9892; --line: #232E28; --surface: #161C19;
  --accent: #4CD3A0; --accent-fg: #06130E; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.shell { display: flex; height: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app {
  flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
  container-type: inline-size;
  padding-block: 0.75rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
}

/* name */
.top { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding-top: 0.5rem; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.modes button { border: 0; background: transparent; border-radius: 999px; height: 1.9rem; padding: 0 0.9rem; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.setter { display: flex; gap: 0.75rem; align-items: center; justify-content: center; margin-top: 0.75rem; }
.setter label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--mute); }
.setter input { width: 4.25rem; height: 2.5rem; text-align: center; font-family: var(--display); font-size: 1.125rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; }
.btn.sm { height: 2rem; padding: 0 0.8rem; font-size: 0.6875rem; }
#name {
  width: min(24rem, 100%);
  text-align: center;
  background: transparent;
  border: 0;
  border-bottom: 1px solid transparent;
  padding: 0.5rem 0.25rem;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.01em;
}
#name::placeholder { color: var(--mute); font-weight: 400; }
#name:hover { border-bottom-color: var(--line); }
#name:focus { outline: none; border-bottom-color: var(--accent); }

/* clock */
.center {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-align: center;
}
#time {
  --chars: 8;
  font-family: var(--display);
  font-weight: 300;
  font-size: min(calc(150cqw / var(--chars)), 36vh, 24rem);
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: opacity 0.2s;
}

.app[data-state="stopped"] #time { opacity: 0.5; }
.app[data-state="paused"] #time { opacity: 0.7; }

.status {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.8125rem; color: var(--mute); letter-spacing: 0.02em;
  min-height: 1.25rem;
}
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--mute); flex: none; }
.app[data-state="running"] .dot { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

.last {
  font-family: var(--display); font-size: 0.75rem; color: var(--mute);
  font-variant-numeric: tabular-nums; min-height: 1rem;
}

.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1.25rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  height: 2.5rem; padding: 0 1.1rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  cursor: pointer;
}
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.count {
  font-family: var(--display); font-size: 0.6875rem; font-weight: 500;
  min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem; border-radius: 999px;
  display: inline-grid; place-items: center;
  background: var(--fg); color: var(--bg); letter-spacing: 0;
}

.foot { display: flex; justify-content: center; padding-bottom: 0.25rem; }
.link {
  background: transparent; border: 0; padding: 0.6rem 0.9rem; cursor: pointer;
  font-size: 0.75rem; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mute);
}
.link:hover { color: var(--fg); }
.link span { font-family: var(--display); letter-spacing: 0; margin-left: 0.25rem; }

/* history sidebar: docked on wide screens, slide-over drawer on narrow ones */
.sheet {
  width: 26rem; flex: none; height: 100%;
  display: flex; flex-direction: column;
  background: var(--bg); border-left: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) 16px;
}
@media (max-width: 760px) {
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(26rem, 92vw); box-shadow: -12px 0 32px rgba(0,0,0,0.25); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; padding-block: 1rem; }
.sheet-head h2 { margin: 0; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
.sheet-head div { display: flex; gap: 0.4rem; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 1rem; }
.sheet-foot { padding-block: 0.5rem 0.75rem; display: flex; justify-content: flex-end; }
.empty { color: var(--mute); font-size: 0.9375rem; line-height: 1.5; padding-block: 2rem; max-width: 30rem; }

.run { padding-block: 1rem; border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.run-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.run-top h3 { margin: 0; font-size: 1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.run-total { font-family: var(--display); font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.run-total small { margin-left: 0.5rem; color: var(--mute); font-size: 0.75rem; }
.run-when { margin: 0.25rem 0 0.5rem; font-size: 0.8125rem; color: var(--mute); font-variant-numeric: tabular-nums; }
.run-none { margin: 0; font-size: 0.8125rem; color: var(--mute); }
.sess { list-style: none; margin: 0; padding: 0; font-family: var(--display); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
.sess li { display: grid; grid-template-columns: 2rem 1fr auto auto; gap: 0.75rem; padding-block: 0.3rem; border-top: 1px dashed var(--line); }
.sess .n, .sess .mu { color: var(--mute); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  max-width: calc(100vw - 32px);
  background: var(--fg); color: var(--bg);
  padding: 0.6rem 1rem; border-radius: 999px;
  font-size: 0.8125rem; text-align: center;
}
</style>

<div class="shell">
<main class="app" id="app" data-state="idle">
  <div class="top">
    <div class="utility-row">
      <span class="eyebrow">FOCUS • FLOW • FINISH</span>
      <div class="utility-actions">
        <button class="utility-btn" id="hist" type="button" aria-expanded="false">History <span id="histn"></span></button>
        <button class="utility-btn" id="fullscreen" type="button" aria-label="Enter fullscreen">⛶ <span id="fullLabel">Fullscreen</span></button>
      </div>
    </div>
    <input id="name" type="text" maxlength="60" autocomplete="off" enterkeyhint="done" placeholder="Name this session" aria-label="Session name">
    <div class="tag-editor">
      <label for="tags">TAGS</label>
      <input id="tags" type="text" maxlength="120" autocomplete="off" placeholder="e.g. deep work, study, writing">
      <span class="tag-hint">Separate tags with commas</span>
    </div>
    <div class="modes" id="modes" role="group" aria-label="Timer mode">
      <button type="button" id="mUp" aria-pressed="true">Stopwatch</button>
      <button type="button" id="mDown" aria-pressed="false">Countdown</button>
    </div>
  </div>
  <div class="center">
    <div id="time" role="timer" aria-label="Time"><span id="hh">00</span><i>:</i><span id="mm">00</span><i>:</i><span id="ss">00</span></div>
    <div class="status"><span class="dot" aria-hidden="true"></span><span id="status">Ready</span></div>
    <div class="last" id="last" hidden></div>
    <div class="setter" id="setter" hidden>
      <label><input id="sh" type="number" min="0" max="99" inputmode="numeric" aria-label="Hours">h</label>
      <label><input id="sm" type="number" min="0" max="59" inputmode="numeric" aria-label="Minutes">m</label>
      <label><input id="sx" type="number" min="0" max="59" inputmode="numeric" aria-label="Seconds">s</label>
    </div>
    <div class="controls" id="controls"></div>
  </div>
</main>

<aside class="sheet" id="sheet" hidden aria-label="History">
  <header class="sheet-head">
    <h2>History</h2>
    <div>
      <button class="btn sm" id="xl" type="button">Excel</button>
      <button class="btn sm" id="csv" type="button">CSV</button>
      <button class="btn sm" id="close" type="button">Close</button>
    </div>
  </header>
  <div class="streak-overview" id="streakOverview"></div>
  <div class="sheet-body" id="runs"></div>
  <footer class="sheet-foot">
    <button class="link" id="clear" type="button">Clear history</button>
  </footer>
</aside>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  'use strict';

  /*CORE*/
  const T = {
    fresh: function (name, mode, target) {
      return { name: name || '', tags: [], mode: mode || 'up', target: target == null ? 300000 : target, status: 'idle', startedAt: null, acc: 0, since: null, segStart: 0, sessions: [], stopAt: null };
    },
    elapsed: function (c, now) { return c.acc + (c.status === 'running' ? now - c.since : 0); },
    start: function (c, now) {
      if (c.status === 'running') return c;
      if (c.status === 'paused') { c.since = now; c.status = 'running'; return c; }
      const n = T.fresh(c.name, c.mode, c.target);
      n.tags = Array.isArray(c.tags) ? c.tags.slice() : [];
      n.status = 'running'; n.startedAt = now; n.since = now;
      return n;
    },
    pause: function (c, now) {
      if (c.status !== 'running') return c;
      c.acc += now - c.since; c.since = null; c.status = 'paused';
      return c;
    },
    log: function (c, now) {
      if (c.status !== 'running' && c.status !== 'paused') return null;
      const e = T.elapsed(c, now);
      const ms = e - c.segStart;
      if (ms < 1000) return null;
      const s = { n: c.sessions.length + 1, ms: ms, at: now, elapsed: e };
      c.sessions.push(s);
      c.segStart = e;
      return s;
    },
    stop: function (c, now) {
      if (c.status !== 'running' && c.status !== 'paused') return null;
      let e = T.elapsed(c, now);
      if (c.mode === 'down') e = Math.min(e, c.target);
      c.acc = e; c.since = null; c.status = 'stopped'; c.stopAt = now;
      return { id: now, name: c.name || 'Untitled', tags: Array.isArray(c.tags) ? c.tags.slice() : [], start: c.startedAt, stop: now, total: e, mode: c.mode, target: c.target, sessions: c.sessions.slice() };
    }
  };
  const pad = function (n) { return String(n).padStart(2, '0'); };
  const parts = function (ms) {
    const s = Math.floor(Math.max(0, ms) / 1000);
    return { h: Math.floor(s / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  };
  const hms = function (ms) { const p = parts(ms); return p.h + ':' + pad(p.m) + ':' + pad(p.s); };
  const hrs = function (ms) { return (ms / 3600000).toFixed(2); };
  const clock = function (t) { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const ymd = function (t) { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  /*ENDCORE*/

  const $ = function (id) { return document.getElementById(id); };
  const el = function (tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const KEY = 'quiet-timer-v1';
  let cur = T.fresh('');
  let runs = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && d.cur && typeof d.cur.status === 'string') {
        cur = Object.assign(T.fresh(''), d.cur);
        if (!Array.isArray(cur.sessions)) cur.sessions = [];
        if (!Array.isArray(cur.tags)) cur.tags = [];
        if (cur.mode !== 'down') cur.mode = 'up';
        if (cur.status === 'running' && typeof cur.since !== 'number') cur = T.fresh(cur.name, cur.mode, cur.target);
      }
      if (d && Array.isArray(d.runs)) runs = d.runs;
    } catch (e) { /* storage unavailable */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ cur: cur, runs: runs })); } catch (e) { /* ignore */ }
  }

  const app = $('app'), timeEl = $('time'), hh = $('hh'), mm = $('mm'), ss = $('ss');
  const statusEl = $('status'), lastEl = $('last'), controls = $('controls'), nameEl = $('name'), tagsEl = $('tags');
  const sheet = $('sheet'), runsEl = $('runs'), xl = $('xl'), toastEl = $('toast');
  const modesEl = $('modes'), mUp = $('mUp'), mDown = $('mDown'), setter = $('setter'), sH = $('sh'), sM = $('sm'), sS = $('sx');

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  /* keep the screen on while timing; harmless if refused */
  let wl = null;
  async function lock() {
    try {
      if (navigator.wakeLock && !wl && document.visibilityState === 'visible') {
        wl = await navigator.wakeLock.request('screen');
        wl.addEventListener('release', function () { wl = null; });
      }
    } catch (e) { wl = null; }
  }
  function unlock() { try { if (wl) wl.release(); } catch (e) { /* ignore */ } wl = null; }

  function beep() {
    try {
      const C = window.AudioContext || window.webkitAudioContext, ctx = new C();
      [0, 0.35, 0.7].forEach(function (t) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
      });
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    } catch (e) { /* ignore */ }
  }

  function updateTime() {
    const e = T.elapsed(cur, Date.now());
    if (cur.mode === 'down' && cur.status === 'running' && e >= cur.target) { doStop(true); return; }
    const ms = cur.mode === 'down' ? Math.ceil(Math.max(0, cur.target - e) / 1000) * 1000 : e;
    const p = parts(ms);
    const h = pad(p.h), m = pad(p.m), s = pad(p.s);
    if (hh.textContent !== h) { hh.textContent = h; timeEl.style.setProperty('--chars', String(h.length + 6)); }
    if (mm.textContent !== m) mm.textContent = m;
    if (ss.textContent !== s) { ss.textContent = s; if (!sheet.hidden) updateLiveTotal(); }
  }

  function mk(label, cls, fn, aria) {
    const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label);
    b.type = 'button';
    b.addEventListener('click', fn);
    if (aria) b.setAttribute('aria-label', aria);
    return b;
  }

  let resetArmed = false, resetTimer = null;
  function renderControls() {
    const st = cur.status, kids = [];
    if (st === 'idle' || st === 'stopped') {
      kids.push(mk('Start', 'primary', doStart));
      if (st === 'stopped') kids.push(mk('Reset', '', doReset));
    } else {
      kids.push(st === 'paused' ? mk('Resume', 'primary', doStart) : mk('Pause', '', doPause));
      kids.push(mk('Stop', '', function () { doStop(); }));
      const n = cur.sessions.length;
      const lg = mk('Log', '', doLog, 'Log session ' + (n + 1));
      if (n) lg.append(el('span', 'count', String(n)));
      kids.push(lg);
      kids.push(mk(resetArmed ? 'Tap again' : 'Reset', '', doReset, 'Reset timer to zero'));
    }
    controls.replaceChildren.apply(controls, kids);
  }

  function renderStatus() {
    const st = cur.status;
    let txt = 'Ready';
    if (st === 'running') txt = 'Running · started ' + clock(cur.startedAt);
    else if (st === 'paused') txt = 'Paused · started ' + clock(cur.startedAt);
    else if (st === 'stopped') txt = 'Stopped · ' + clock(cur.startedAt) + ' → ' + clock(cur.stopAt);
    statusEl.textContent = txt;
    const n = cur.sessions.length;
    if (n) {
      const s = cur.sessions[n - 1];
      lastEl.textContent = 'Session ' + s.n + ' · ' + hms(s.ms) + ' · ' + hrs(s.ms) + ' h';
    }
    lastEl.hidden = !n;
  }

  function renderAll() {
    app.dataset.state = cur.status;
    renderControls();
    renderStatus();
    updateTime();
    $('histn').textContent = runs.length ? '(' + runs.length + ')' : '';
    const live = cur.status === 'running' || cur.status === 'paused';
    modesEl.hidden = live;
    setter.hidden = !(cur.mode === 'down' && !live);
    mUp.setAttribute('aria-pressed', String(cur.mode === 'up'));
    mDown.setAttribute('aria-pressed', String(cur.mode === 'down'));
    if (!sheet.hidden) renderHistory();
  }

  function syncSetter() {
    const p = parts(cur.target);
    sH.value = p.h; sM.value = p.m; sS.value = p.s;
  }
  function onSet() {
    const v = function (i, max) { return Math.min(max, Math.max(0, parseInt(i.value, 10) || 0)); };
    cur.target = ((v(sH, 99) * 60 + v(sM, 59)) * 60 + v(sS, 59)) * 1000;
    if (cur.status === 'stopped') { const tags = (cur.tags || []).slice(); cur = T.fresh(cur.name, cur.mode, cur.target); cur.tags = tags; }
    save(); renderAll();
  }
  function setMode(m) {
    if (cur.status === 'running' || cur.status === 'paused' || cur.mode === m) return;
    const keepTags = (cur.tags || []).slice();
    cur = T.fresh(cur.name, m, cur.target); cur.tags = keepTags;
    save(); syncSetter(); renderAll();
  }
  function doReset() {
    const live = cur.status === 'running' || cur.status === 'paused';
    if (live && !resetArmed) {
      resetArmed = true; renderControls();
      resetTimer = setTimeout(function () { resetArmed = false; renderControls(); }, 3000);
      toast('Tap Reset again to discard this run.');
      return;
    }
    clearTimeout(resetTimer); resetArmed = false; unlock();
    const keepTags = (cur.tags || []).slice();
    cur = T.fresh(cur.name, cur.mode, cur.target); cur.tags = keepTags;
    save(); renderAll(); toast('Timer reset.');
  }

  function doStart() {
    if (cur.mode === 'down' && (cur.status === 'idle' || cur.status === 'stopped') && cur.target < 1000) { toast('Set a time first.'); return; }
    cur = T.start(cur, Date.now()); save(); lock(); renderAll();
  }
  function doPause() { cur = T.pause(cur, Date.now()); save(); unlock(); renderAll(); }
  function doLog() {
    const s = T.log(cur, Date.now());
    if (!s) { toast('Nothing new to log yet.'); return; }
    save(); renderAll();
    toast('Session ' + s.n + ' logged · ' + hms(s.ms) + ' · ' + hrs(s.ms) + ' h');
  }
  function doStop(auto) {
    const r = T.stop(cur, Date.now());
    if (!r) return;
    clearTimeout(resetTimer); resetArmed = false;
    runs.push(r); save(); unlock(); renderAll();
    if (auto === true) { beep(); toast("Time's up · " + hms(r.total)); }
    else toast('Saved · ' + hms(r.total));
  }

  /* history */
  function dateLabel(t) {
    return new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  function runEl(r, live) {
    const a = el('article', 'run');
    const top = el('div', 'run-top');
    top.append(el('h3', '', r.name || 'Untitled'));
    const tot = el('span', 'run-total' + (live ? ' live-total' : ''), hms(r.total));
    tot.append(el('small', '', hrs(r.total) + ' h'));
    top.append(tot);
    a.append(top);
    if (r.tags && r.tags.length) {
      const tagRow = el('div', 'run-tags');
      r.tags.forEach(function (tag) { tagRow.append(el('span', 'tag-chip', tag)); });
      a.append(tagRow);
    }
    let when = (live ? 'In progress · ' : '') + dateLabel(r.start) + ' · ' + clock(r.start);
    if (r.mode === 'down') when += ' · Countdown ' + hms(r.target);
    if (r.stop) when += ' → ' + (ymd(r.stop) !== ymd(r.start) ? dateLabel(r.stop) + ' ' : '') + clock(r.stop);
    a.append(el('p', 'run-when', when));
    if (r.sessions.length) {
      const ol = el('ol', 'sess');
      r.sessions.forEach(function (s) {
        const li = el('li');
        li.append(el('span', 'n', 'S' + s.n), el('span', '', hms(s.ms)), el('span', 'mu', hrs(s.ms) + ' h'), el('span', 'mu', clock(s.at)));
        ol.append(li);
      });
      a.append(ol);
      const chart = el('div', 'session-chart');
      chart.append(el('div', 'chart-title', 'SESSION RHYTHM'));
      const maxMs = Math.max.apply(null, r.sessions.map(function (x) { return x.ms; }).concat([1]));
      r.sessions.forEach(function (session, idx) {
        const row = el('div', 'chart-row');
        const label = el('span', 'chart-label', 'S' + session.n);
        const track = el('div', 'chart-track');
        const bar = el('div', 'chart-bar');
        bar.style.width = Math.max(3, session.ms / maxMs * 100) + '%';
        track.append(bar);
        const value = el('span', 'chart-value', hms(session.ms));
        row.append(label, track, value);
        chart.append(row);
        if (idx > 0) {
          const gapMs = Math.max(0, session.at - r.sessions[idx - 1].at - r.sessions[idx - 1].ms);
          chart.append(el('div', 'gap-note', '↳ ' + hms(gapMs) + ' between logs'));
        }
      });
      a.append(chart);
    } else {
      a.append(el('p', 'run-none', 'No sessions logged'));
    }
    return a;
  }
  function updateLiveTotal() {
    const t = runsEl.querySelector('.live-total');
    if (!t) { if (cur.status === 'running' || cur.status === 'paused') renderHistory(); return; }
    const ms = T.elapsed(cur, Date.now());
    t.firstChild.nodeValue = hms(ms);
    t.lastChild.textContent = hrs(ms) + ' h';
  }
  function allRuns() {
    const list = runs.slice();
    if (cur.status === 'running' || cur.status === 'paused') {
      list.push({ name: cur.name || 'Untitled', tags: (cur.tags || []).slice(), start: cur.startedAt, stop: null, total: T.elapsed(cur, Date.now()), mode: cur.mode, target: cur.target, sessions: cur.sessions.slice(), live: true });
    }
    return list;
  }
  function streakStats() {
    const days = Array.from(new Set(runs.filter(function (r) { return r.start; }).map(function (r) { return ymd(r.start); }))).sort();
    if (!days.length) return { current: 0, best: 0 };
    const set = new Set(days);
    let best = 0, streak = 0, prev = null;
    days.forEach(function (day) {
      const d = new Date(day + 'T12:00:00');
      const n = d.getTime();
      streak = prev !== null && n - prev === 86400000 ? streak + 1 : 1;
      best = Math.max(best, streak);
      prev = n;
    });
    const today = new Date(); today.setHours(12,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const last = days[days.length - 1];
    let current = 0;
    if (last === ymd(today.getTime()) || last === ymd(yesterday.getTime())) {
      let cursor = new Date(last + 'T12:00:00');
      current = 1;
      while (true) {
        cursor.setDate(cursor.getDate() - 1);
        if (!set.has(ymd(cursor.getTime()))) break;
        current++;
      }
    }
    return { current: current, best: best };
  }
  function renderStreak() {
    const box = $('streakOverview');
    if (!box) return;
    const stats = streakStats();
    box.replaceChildren();
    const current = el('div', 'streak-stat');
    current.append(el('span', 'streak-icon', '✦'), el('strong', '', String(stats.current)), el('small', '', 'DAY STREAK'));
    const best = el('div', 'streak-stat');
    best.append(el('span', 'streak-icon', '↗'), el('strong', '', String(stats.best)), el('small', '', 'BEST STREAK'));
    box.append(current, best);
  }
  function renderHistory() {
    renderStreak();
    const list = allRuns().reverse();
    if (!list.length) {
      runsEl.replaceChildren(el('p', 'empty', 'No runs yet. Press Start, then Stop to save a run here. Use Log to mark sessions along the way.'));
      return;
    }
    runsEl.replaceChildren.apply(runsEl, list.map(function (r) { return runEl(r, !!r.live); }));
  }
  function openSheet() { renderHistory(); sheet.hidden = false; $('hist').setAttribute('aria-expanded', 'true'); }
  function closeSheet() { sheet.hidden = true; $('hist').setAttribute('aria-expanded', 'false'); }

  let armed = false, armTimer = null;
  function doClear() {
    const b = $('clear');
    if (!armed) {
      armed = true; b.textContent = 'Tap again to clear';
      armTimer = setTimeout(function () { armed = false; b.textContent = 'Clear history'; }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false; b.textContent = 'Clear history';
    runs = []; save(); renderHistory(); renderAll();
  }

  /* export: real file download (Blob), with the Claude downloads capability used if present */
  let dl = null;
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { dl = d; }).catch(function () { /* ignore */ });
    }
  } catch (e) { /* ignore */ }

  const r4 = function (x) { return Math.round(x * 1e4) / 1e4; };
  async function saveFile(filename, blob) {
    if (dl) {
      try { await dl.save({ filename: filename, data: new Uint8Array(await blob.arrayBuffer()) }); return; }
      catch (e) { if (e && e.code === 'declined') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Downloaded ' + filename);
  }
  const modeName = function (r) { return r.mode === 'down' ? 'Countdown' : 'Stopwatch'; };

  function exportXlsx() {
    const list = allRuns();
    if (!list.length) { toast('Nothing to export yet.'); return; }
    if (typeof XLSX === 'undefined') { toast('Excel library did not load (needs internet). Try CSV.'); return; }
    const runRows = [['Name', 'Tags', 'Mode', 'Start date', 'Start time', 'Stop date', 'Stop time', 'Total (h:mm:ss)', 'Total (hours)', 'Sessions logged']];
    const sessRows = [['Name', 'Start date', 'Session #', 'Duration (h:mm:ss)', 'Duration (hours)', 'Logged at', 'Timer at log (h:mm:ss)']];
    list.forEach(function (r) {
      runRows.push([r.name, (r.tags || []).join('; '), modeName(r), ymd(r.start), clock(r.start), r.stop ? ymd(r.stop) : '', r.stop ? clock(r.stop) : 'running', hms(r.total), r4(r.total / 3600000), r.sessions.length]);
      r.sessions.forEach(function (s) {
        sessRows.push([r.name, ymd(r.start), s.n, hms(s.ms), r4(s.ms / 3600000), clock(s.at), hms(s.elapsed)]);
      });
    });
    const wb = XLSX.utils.book_new();
    const w1 = XLSX.utils.aoa_to_sheet(runRows);
    w1['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 12 }, { wch: 11 }, { wch: 12 }, { wch: 11 }, { wch: 16 }, { wch: 14 }, { wch: 15 }];
    const w2 = XLSX.utils.aoa_to_sheet(sessRows);
    w2['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 10 }, { wch: 18 }, { wch: 16 }, { wch: 11 }, { wch: 22 }];
    XLSX.utils.book_append_sheet(wb, w1, 'Runs');
    XLSX.utils.book_append_sheet(wb, w2, 'Sessions');
    try {
      const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      saveFile('timer-sessions-' + ymd(Date.now()) + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) { toast('Could not create the Excel file.'); }
  }

  const csvCell = function (v) { const t = String(v == null ? '' : v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  function exportCsv() {
    const list = allRuns();
    if (!list.length) { toast('Nothing to export yet.'); return; }
    const rows = [['Name', 'Tags', 'Mode', 'Start date', 'Start time', 'Stop date', 'Stop time', 'Run total (h:mm:ss)', 'Run total (hours)', 'Session #', 'Session (h:mm:ss)', 'Session (hours)', 'Logged at']];
    list.forEach(function (r) {
      const base = [r.name, (r.tags || []).join('; '), modeName(r), ymd(r.start), clock(r.start), r.stop ? ymd(r.stop) : '', r.stop ? clock(r.stop) : 'running', hms(r.total), r4(r.total / 3600000)];
      if (!r.sessions.length) rows.push(base.concat(['', '', '', '']));
      else r.sessions.forEach(function (s) { rows.push(base.concat([s.n, hms(s.ms), r4(s.ms / 3600000), clock(s.at)])); });
    });
    const text = '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    saveFile('timer-sessions-' + ymd(Date.now()) + '.csv', new Blob([text], { type: 'text/csv;charset=utf-8' }));
  }

  /* wiring */
  nameEl.addEventListener('input', function () { cur.name = nameEl.value; save(); });
  tagsEl.addEventListener('input', function () {
    cur.tags = tagsEl.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 8);
    save();
  });
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') nameEl.blur(); });
  $('hist').addEventListener('click', function () { if (sheet.hidden) openSheet(); else closeSheet(); });
  const fsButton = $('fullscreen');
  function syncFullscreenLabel() {
    const active = !!document.fullscreenElement;
    $('fullLabel').textContent = active ? 'Exit fullscreen' : 'Fullscreen';
    fsButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
  }
  fsButton.addEventListener('click', async function () {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (e) { toast('Fullscreen is not available in this browser.'); }
    syncFullscreenLabel();
  });
  document.addEventListener('fullscreenchange', syncFullscreenLabel);
  mUp.addEventListener('click', function () { setMode('up'); });
  mDown.addEventListener('click', function () { setMode('down'); });
  [sH, sM, sS].forEach(function (i) { i.addEventListener('input', onSet); i.addEventListener('focus', function () { i.select(); }); });
  $('csv').addEventListener('click', exportCsv);
  $('close').addEventListener('click', closeSheet);
  $('clear').addEventListener('click', doClear);
  xl.addEventListener('click', exportXlsx);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (e.code !== 'Space') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON')) return;
    e.preventDefault();
    if (cur.status === 'running') doPause(); else doStart();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { updateTime(); if (cur.status === 'running') lock(); }
  });

  load();
  nameEl.value = cur.name || '';
  tagsEl.value = (cur.tags || []).join(', ');
  syncSetter();
  renderAll();
  if (cur.status === 'running') lock();
  setInterval(updateTime, 200);
})();
</script>

</body></html>
