/* ── Aesthetic refinement: visual-only layer; timer logic and controls unchanged ── */
:root {
  --bg: #f4f5f0;
  --fg: #18221d;
  --mute: #78847c;
  --line: #dfe5dc;
  --surface: #e9eee7;
  --accent: #39785b;
  --accent-fg: #fffdf8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713;
    --fg: #edf3ed;
    --mute: #9ba99f;
    --line: #2b3930;
    --surface: #1a251e;
    --accent: #8bc6a2;
    --accent-fg: #102017;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --fg: #edf3ed; --mute: #9ba99f;
  --line: #2b3930; --surface: #1a251e;
  --accent: #8bc6a2; --accent-fg: #102017;
}
body {
  background:
    radial-gradient(ellipse at 50% 5%, rgba(123, 164, 132, .12), transparent 38%),
    var(--bg);
  letter-spacing: .005em;
}
.app {
  padding: clamp(1rem, 2.5vh, 2rem) clamp(1rem, 3vw, 2.75rem);
}
.top { gap: .85rem; padding-top: .4rem; }

  content: "A LITTLE SPACE TO FOCUS";
  color: var(--mute);
  font-size: .61rem;
  font-weight: 600;
  letter-spacing: .22em;
}

  font-size: 1.05rem;
  letter-spacing: .015em;
  padding: .65rem .5rem;
  transition: border-color .2s, color .2s;
}
.modes {
  padding: 4px;
  gap: 3px;
  border-color: var(--line);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
}

  height: 2.15rem;
  padding-inline: 1.15rem;
  font-size: .64rem;
  letter-spacing: .12em;
  transition: background .2s, color .2s, transform .2s;
}
.modes button[aria-pressed="true"] {
  box-shadow: 0 2px 8px rgba(25, 55, 37, .14);
}
.center {
  position: relative;
  isolation: isolate;
  gap: .8rem;
}
.center::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: min(76vw, 35rem);
  aspect-ratio: 1;
  border: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--surface) 55%, transparent), transparent 68%);
  pointer-events: none;
}
#time {
  font-weight: 300;
  letter-spacing: -.075em;
  text-shadow: 0 8px 35px rgba(36, 72, 49, .06);
}
#time i { opacity: .24; padding-inline: .035em; }
.status {
  gap: .65rem;
  font-size: .72rem;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.dot { width: .42rem; height: .42rem; }
.last {
  padding: .4rem .8rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  font-size: .68rem;
}
.setter {
  gap: .55rem;
  margin-top: .7rem;
  padding: .65rem .85rem;
  border: 1px solid var(--line);
  border-radius: 1rem;

}

  width: 3.7rem;
  height: 2.6rem;

  min-height: 2.65rem;

  border-radius: 999px;

  background: color-mix(in srgb, var(--surface) 42%, transparent);

  transition: transform .18s, background .18s, box-shadow .18s, border-color .18s;

  padding-inline: 1.6rem;
  background: var(--accent);
  color: var(--accent-fg);

.foot { padding-bottom: .15rem; }

  border-radius: 999px;
  padding: .7rem 1rem;
  font-size: .65rem;
  letter-spacing: .14em;
  transition: background .2s, color .2s;
}
.link:hover { background: var(--surface); }

  width: min(29rem, 42vw);
  padding-inline: clamp(1rem, 2.2vw, 2rem);
  background: color-mix(in srgb, var(--bg) 94%, var(--surface));

.sheet-head > div { gap: .35rem; }
.btn.sm {
  height: 2.1rem;
  min-height: 2.1rem;
  padding-inline: .8rem;
  font-size: .6rem;
}

  padding-block: 1.15rem;

}
.run:first-child { padding-top: .9rem; }
.run-top h3 { font-size: .95rem; letter-spacing: -.015em; }
.run-total { font-size: .95rem; }
.run-when { line-height: 1.55; font-size: .74rem; }
.sess { font-size: .73rem; }
.sess li { gap: .55rem; padding-block: .42rem; border-top-style: solid; }
.empty {
  padding: 2.5rem 1.25rem;
  border: 1px dashed var(--line);
  border-radius: 1rem;
  margin-top: 1.25rem;
  background: color-mix(in srgb, var(--surface) 35%, transparent);
  font-size: .86rem;
}
.sheet-foot { border-top: 1px solid var(--line); }
.toast {
  padding: .75rem 1.1rem;
  border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  box-shadow: 0 10px 30px rgba(0,0,0,.16);

@media (max-width: 760px) {

    width: min(29rem, 94vw);

  }
  .sheet-head { padding-top: max(1rem, env(safe-area-inset-top, 0px)); }

}

  .controls { gap: .45rem; }
  .btn { padding-inline: .9rem; }

  .setter input { width: 3.2rem; }
}

/* ── Focus studio additions ── */
.utility-row { width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.eyebrow { color:var(--mute); font-size:.58rem; font-weight:600; letter-spacing:.2em; }
.utility-actions { display:flex; align-items:center; gap:.45rem; }

  letter-spacing:.08em; text-transform:uppercase; cursor:pointer; transition:.2s ease;
}

.tag-editor label { color:var(--mute); font-size:.58rem; font-weight:600; letter-spacing:.16em; }

  min-width:0; width:min(22rem,70%); border:1px solid var(--line); border-radius:999px;
  background:color-mix(in srgb,var(--surface) 60%,transparent); color:var(--fg);
  padding:.55rem .9rem; font: .75rem var(--body); outline:none; transition:border-color .2s,box-shadow .2s;
}
.tag-editor input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent); }
.tag-editor input::placeholder { color:var(--mute); }
.tag-hint { color:var(--mute); font-size:.59rem; opacity:.8; }
.run-tags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.65rem; }
.tag-chip { display:inline-flex; border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line)); color:var(--accent); background:color-mix(in srgb,var(--accent) 9%,transparent); border-radius:999px; padding:.22rem .58rem; font-size:.64rem; }
.session-chart { margin-top:.9rem; padding:.85rem .9rem; border:1px solid var(--line); border-radius:1rem; background:color-mix(in srgb,var(--surface) 38%,transparent); }
.chart-title { color:var(--mute); font-size:.57rem; font-weight:600; letter-spacing:.16em; margin-bottom:.65rem; }
.chart-row { display:grid; grid-template-columns:1.6rem minmax(2rem,1fr) 4.6rem; align-items:center; gap:.55rem; margin:.45rem 0; }
.chart-label { color:var(--mute); font: .65rem var(--display); }
.chart-track { height:.48rem; border-radius:999px; overflow:hidden; background:var(--line); }
.chart-bar { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#d4c99b)); transform-origin:left; animation:bar-arrive .75s cubic-bezier(.2,.8,.2,1) backwards; }
.chart-value { color:var(--mute); text-align:right; font: .62rem var(--display); }
.gap-note { color:var(--mute); opacity:.8; font-size:.58rem; padding-left:2.2rem; margin:-.1rem 0 .25rem; }
.streak-overview { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; padding:0 0 1rem; border-bottom:1px solid var(--line); }
.streak-stat { display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:.55rem; padding:.75rem .85rem; border:1px solid var(--line); border-radius:1rem; background:color-mix(in srgb,var(--surface) 48%,transparent); }
.streak-icon { grid-row:span 2; display:grid; place-items:center; width:2rem; height:2rem; border-radius:50%; background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); }
.streak-stat strong { font:500 1.2rem var(--display); line-height:1.1; }
.streak-stat small { color:var(--mute); font-size:.55rem; letter-spacing:.13em; }
.app { position:relative; overflow:hidden; }
.app::after {
  content:""; position:absolute; z-index:-1; width:18rem; height:18rem; border-radius:50%;
  right:-8rem; top:18%; pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 12%,transparent),transparent 68%);
  animation:drift 13s ease-in-out infinite alternate;
}
.center::before { animation:halo-breathe 7s ease-in-out infinite; }

.run { animation:rise-in .45s ease both; }

@media (max-width:760px) {
  .utility-row { align-items:flex-start; }
  .eyebrow { padding-top:.7rem; font-size:.5rem; }
  .utility-actions { gap:.3rem; }
  .utility-btn { padding:.5rem .65rem; font-size:.57rem; }

<style>
/* Layout: one full-viewport column. Session name on top, an oversized thin-weight clock centred, a quiet row of small controls beneath it, History at the foot. */
:root {
  --bg: #F2F4F1;
  --fg: #13171A;
  --mute: #5D6862;
  --line: #D5DBD4;
  --surface: #E7EBE6;
  --accent: #1B7F5C;
  --accent-fg: #FFFFFF;
  --display: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1110; --fg: #E9EEEA; --mute: #8D9892; --line: #232E28; --surface: #161C19;
    --accent: #4CD3A0; --accent-fg: #06130E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1110; --fg: #E9EEEA; --mute: #8D9892; --line: #232E28; --surface: #161C19;
  --accent: #4CD3A0; --accent-fg: #06130E; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.shell { display: flex; height: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app {
  flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
  container-type: inline-size;
  padding-block: 0.75rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
}

/* name */
.top { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding-top: 0.5rem; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.modes button { border: 0; background: transparent; border-radius: 999px; height: 1.9rem; padding: 0 0.9rem; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.setter { display: flex; gap: 0.75rem; align-items: center; justify-content: center; margin-top: 0.75rem; }
.setter label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--mute); }
.setter input { width: 4.25rem; height: 2.5rem; text-align: center; font-family: var(--display); font-size: 1.125rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; }
.btn.sm { height: 2rem; padding: 0 0.8rem; font-size: 0.6875rem; }
#name {
  width: min(24rem, 100%);
  text-align: center;
  background: transparent;
  border: 0;
  border-bottom: 1px solid transparent;
  padding: 0.5rem 0.25rem;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.01em;
}
#name::placeholder { color: var(--mute); font-weight: 400; }
#name:hover { border-bottom-color: var(--line); }
#name:focus { outline: none; border-bottom-color: var(--accent); }

/* clock */
.center {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-align: center;
}
#time {
  --chars: 8;
  font-family: var(--display);
  font-weight: 300;
  font-size: min(calc(150cqw / var(--chars)), 36vh, 24rem);
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: opacity 0.2s;
}
#time i { font-style: normal; opacity: 0.35; padding: 0 0.02em; }
.app[data-state="stopped"] #time { opacity: 0.5; }
.app[data-state="paused"] #time { opacity: 0.7; }

.status {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.8125rem; color: var(--mute); letter-spacing: 0.02em;
  min-height: 1.25rem;
}
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--mute); flex: none; }
.app[data-state="running"] .dot { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .app[data-state="running"] .dot { animation: none; } }
.last {
  font-family: var(--display); font-size: 0.75rem; color: var(--mute);
  font-variant-numeric: tabular-nums; min-height: 1rem;
}

.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1.25rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  height: 2.5rem; padding: 0 1.1rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  cursor: pointer;
}
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.count {
  font-family: var(--display); font-size: 0.6875rem; font-weight: 500;
  min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem; border-radius: 999px;
  display: inline-grid; place-items: center;
  background: var(--fg); color: var(--bg); letter-spacing: 0;
}

.foot { display: flex; justify-content: center; padding-bottom: 0.25rem; }
.link {
  background: transparent; border: 0; padding: 0.6rem 0.9rem; cursor: pointer;
  font-size: 0.75rem; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mute);
}
.link:hover { color: var(--fg); }
.link span { font-family: var(--display); letter-spacing: 0; margin-left: 0.25rem; }

/* history sidebar: docked on wide screens, slide-over drawer on narrow ones */
.sheet {
  width: 26rem; flex: none; height: 100%;
  display: flex; flex-direction: column;
  background: var(--bg); border-left: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) 16px;
}
@media (max-width: 760px) {
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(26rem, 92vw); box-shadow: -12px 0 32px rgba(0,0,0,0.25); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; padding-block: 1rem; }
.sheet-head h2 { margin: 0; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
.sheet-head div { display: flex; gap: 0.4rem; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 1rem; }
.sheet-foot { padding-block: 0.5rem 0.75rem; display: flex; justify-content: flex-end; }
.empty { color: var(--mute); font-size: 0.9375rem; line-height: 1.5; padding-block: 2rem; max-width: 30rem; }

.run { padding-block: 1rem; border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.run-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.run-top h3 { margin: 0; font-size: 1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.run-total { font-family: var(--display); font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

  function mk(label, cls, fn, aria) {

  function syncSetter() {

  /* eight little scenes: where the townsfolk spend their time. Character feet are at y=82 in a 120x92 box. */
  const sc = function (name, cx, act, back, front) { return { name: name, cx: cx, act: act, back: back, front: front || '' }; };
  const crop = function (x, y, d, a, b) { return '<g class="crop" style="transform-origin:' + x + 'px ' + y + 'px;animation-delay:' + d + 's"><path d="M' + x + ' ' + y + ' v-8" stroke="#8FA68A" stroke-width="2.2"/><ellipse cx="' + (x - 4.5) + '" cy="' + (y - 8) + '" rx="4.6" ry="2.2" fill="' + a + '" transform="rotate(-25 ' + (x - 4.5) + ' ' + (y - 8) + ')"/><ellipse cx="' + (x + 4.5) + '" cy="' + (y - 9) + '" rx="4.6" ry="2.2" fill="' + b + '" transform="rotate(25 ' + (x + 4.5) + ' ' + (y - 9) + ')"/></g>'; };

      '<g class="hoe" style="transform-origin:44px 68px"><line x1="44" y1="68" x2="66" y2="46" stroke="#A78B73" stroke-width="2.6" stroke-linecap="round"/><path d="M64 44 l9 3 l-4 5z" fill="#B8B2A8"/></g><ellipse cx="34" cy="41" rx="14" ry="3.6" fill="#EBDCAE"/><path d="M26 41 q8 -13 16 0z" fill="#EBDCAE"/><path d="M26 40 h16" stroke="#D9A58F" stroke-width="2"/>'),

    sc('coffee', 36, 'sip',
      '<ellipse cx="82" cy="82" rx="14" ry="3" fill="#CFC4B3" opacity=".7"/><rect x="80.5" y="62" width="3" height="20" fill="#B49B83"/><path d="M82 17 v47" stroke="#B49B83" stroke-width="2"/><path d="M58 38 q24 -22 48 0z" fill="#E8C4BE"/><path d="M58 38 q6 -6 12 0 q6 -6 12 0 q6 -6 12 0 q6 -6 12 0" fill="none" stroke="#F4EBDD" stroke-width="1.4" opacity=".85"/>',
      '<ellipse cx="82" cy="62" rx="17" ry="4.4" fill="#E9D6BC"/><rect x="77" y="55" width="9" height="7" rx="2" fill="#FBF5EA" stroke="#CFC4B3"/><path class="steam" d="M80 53 q-2 -4 0 -7 M84 53 q-2 -4 0 -7" stroke="#CFC4B3" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="92" cy="60.5" r="3" fill="#E3C9A8"/>'),
    sc('reading', 70, 'read',
      '<ellipse cx="60" cy="82" rx="50" ry="5" fill="#CFC4B3" opacity=".5"/><rect x="14" y="36" width="9" height="46" rx="4" fill="#B49B83"/><circle cx="18" cy="30" r="17" fill="#A9BC9C"/><circle cx="6" cy="38" r="12" fill="#BFCDB0"/><circle cx="31" cy="36" r="12" fill="#BFCDB0"/><g class="leaf"><ellipse cx="34" cy="44" rx="2.6" ry="1.4" fill="#EEDCA6" transform="rotate(30 34 44)"/></g>'),
    sc('fishing', 30, 'fish',
      '<ellipse cx="84" cy="76" rx="32" ry="9" fill="#BCD0D6"/><ellipse cx="84" cy="76" rx="22" ry="5.5" fill="#A9C0C9" opacity=".7"/><ellipse class="rip" cx="98" cy="75" rx="6" ry="2" fill="none" stroke="#F4F2EC" stroke-width="1"/>',

    sc('painting', 34, 'paint',
      '<path d="M70 82 l6 -34 M92 82 l-6 -34 M81 82 v-30" stroke="#B49B83" stroke-width="2.4" stroke-linecap="round"/><rect x="62" y="30" width="38" height="28" rx="2" fill="#FBF5EA" stroke="#CFC4B3"/><path class="pt" d="M67 50 q8 -10 16 -2 t14 -6" pathLength="1" stroke="#E3B7B0" stroke-width="3.4" fill="none" stroke-linecap="round"/><path class="pt p2" d="M67 40 q10 6 18 0 t12 4" pathLength="1" stroke="#A9C0C9" stroke-width="3" fill="none" stroke-linecap="round"/>',

      [66, 78, 90, 102].map(flower).join('') + '<ellipse cx="85" cy="82" rx="30" ry="3.4" fill="#C9AE92"/>',

    sc('camping', 30, 'camp',
      '<path d="M70 82 l20 -32 l20 32z" fill="#E8C4BE"/><path d="M90 50 l8 32 h-8z" fill="#D9A58F"/><ellipse cx="54" cy="82" rx="14" ry="3" fill="#CFC4B3" opacity=".6"/><path d="M46 80 l16 -3 M46 77 l16 3" stroke="#A78B73" stroke-width="2.6" stroke-linecap="round"/>',
      '<g class="fire" style="transform-origin:54px 78px"><path d="M54 60 q8 8 4 14 q-4 6 -8 0 q-4 -6 4 -14z" fill="#F0C898"/><path d="M54 66 q4 5 2 8 q-2 3 -4 0 q-2 -3 2 -8z" fill="#F7E3B8"/></g><circle class="spark" cx="54" cy="56" r="1.2" fill="#F7E3B8"/><path d="M38 64 L52 71" stroke="#A78B73" stroke-width="1.8"/><circle cx="52" cy="71" r="2.8" fill="#FBF5EA"/>')
  ];

  /* what the townsfolk and the walker say */
  const GOSSIP = ['Psst… look at him walking', 'He looks so tired', 'Still going. Wow.', 'He never stops, that one', 'Must be a big goal', 'Shh, he will hear us', 'Respect.', 'How many hours now?', 'I would have napped by now', 'Is that a flag over there?'];
  const TOWN = { run: ['He is off again!', 'Look, he started'], rest: ['He is finally resting', 'A break, at last'], win: ['He did it!', 'What a day'], idle: ['Quiet today'] };
  const THOUGHTS = {
    run0: ['Step by step', 'One foot, then the other', 'Feeling good'],
    run1: ['So tired…', 'Is it far yet?', 'Just a little more'],
    run2: ['Can’t stop now', 'Legs… so heavy', 'Still going. Still going.', 'The flag is closer'],
    rest: ['Phew…', 'Catching my breath', 'Five more minutes?'],
    win: ['We made it today!', 'What a walk!'],
    idle: ['Ready for a long walk', 'Press start when you are']
  };
  const TAP = ['Hehe!', 'Hi there!', 'Boop!', 'You are doing great', 'Keep it up!'];

  const docEl = document.documentElement;
  let world = null, laneEl = null, actorsEl = null, goalEl = null, kfEl = null, walkerEl = null, wk = null;
  let WW = 0, WH = 0, PH = false, Y0 = 0, ROAD = 0, FAR = 0;
  let folk = [], gatherT = 0, gathering = false, cheerLock = false, cheerLockT = 0, laneTick = 0;
  let lastStatus = null, lastBuilt = '', nextThought = 0, lastGoalCount = -1;

  function geo() {
    const app = $('app').getBoundingClientRect(), vh = window.innerHeight;
    const phone = window.matchMedia('(max-width:760px) and (min-height:521px)').matches;
    let h = phone ? (vh >= 700 ? 128 : 0) : (vh >= 780 ? 190 : (vh >= 700 ? 150 : 0));
    if (app.width < 300) h = 0;
    return { left: Math.round(app.left), w: Math.round(app.width), h: h, phone: phone };
  }

  /* perspective: tiles and bushes start tiny at the horizon and grow as they come toward you */
  function laneKeyframes(tw) {
    const sFar = FAR / ROAD, N = 14, th = 16;
    let css = '';
    [['wtL', -1, 0], ['wtR', 1, 0], ['wfL', -1, 1], ['wfR', 1, 1]].forEach(function (d) {
      let s = '';
      for (let i = 0; i <= N; i++) {
        const u = i / N, sc = 1 / (1 + (1 / sFar - 1) * (1 - u)), y = Y0 + (WH - Y0) * (sc - sFar) / (1 - sFar);
        const w = d[2] ? 24 : tw, h = d[2] ? 18 : th, off = d[2] ? d[1] * ROAD * 1.28 * sc : d[1] * ROAD * 0.3 * sc;
        const op = u < 0.07 ? u / 0.07 : u > 0.93 ? (1 - u) / 0.07 : 1;
        s += (u * 100).toFixed(1) + '%{opacity:' + op.toFixed(2) + ';transform:translate(' + (off - w / 2).toFixed(1) + 'px,' + (y - h / 2).toFixed(1) + 'px) scale(' + sc.toFixed(3) + ',' + (sc * (d[2] ? 0.85 : 0.42)).toFixed(3) + ')}';
      }
      css += '@keyframes ' + d[0] + '{' + s + '}';
    });
    return css;
  }

  function teardown() {
    clearTimeout(gatherT); gathering = false;
    folk.forEach(function (f) { clearTimeout(f.t); clearTimeout(f.sayT); });
    folk = [];
    if (wk) clearTimeout(wk.sayT);
    if (world) world.remove();
    if (kfEl) kfEl.remove();
    world = null; kfEl = null; walkerEl = null; wk = null; laneEl = null; actorsEl = null; goalEl = null;
  }

  function slots() {
    const sw = 120 * (PH ? 0.78 : 1.05), half = WW / 2, gap = ROAD + 8, out = [];
    [[4, half - gap], [half + gap, WW - 4]].forEach(function (fl, side) {
      const room = fl[1] - fl[0], n = Math.max(1, Math.min(PH ? 1 : 2, Math.floor(room / (sw * 0.95))));
      for (let i = 0; i < n; i++) out.push({ cx: fl[0] + room * (i + 0.5) / n, side: side });
    });
    return out;
  }
  function sceneFor(f, slot, used) {
    const ok = SCENES.filter(function (s) { return used.indexOf(s.name) < 0 && s.name !== f.lastDef; });
    const def = pick(ok.length ? ok : SCENES), d = Math.random(), k = (PH ? 0.78 : 1.05) * (1 - 0.2 * d);
    const bottom = Math.min(Math.round(4 + d * WH * 0.16), Math.round(WH - 92 * k));

  }
  function showScene(f, s) {
    removeScene(f);
    const z = 1000 - s.bottom;
    const mk = function (cls, svg, zz) {
      const d = el('div', 'sc ' + cls);
      d.style.cssText = 'left:' + s.left + 'px;bottom:' + s.bottom + 'px;width:' + (120 * s.k) + 'px;height:' + (92 * s.k) + 'px;z-index:' + zz;
      d.innerHTML = '<svg viewBox="0 0 120 92" width="100%" height="100%" aria-hidden="true">' + svg + '</svg>';
      return d;
    };
    const b = mk('sc-b', s.def.back, z - 1), fr = mk('sc-f', s.def.front, z + 1);

  }
  function removeScene(f) {
    if (!f.scene) return;
    f.lastDef = f.scene.def.name;
    f.scene.nodes.forEach(function (n) { n.classList.add('gone'); setTimeout(function () { n.remove(); }, 600); });
    f.scene = null;
  }

  function setAct(h, act) { h.root.classList.remove('a-' + h.act); h.root.classList.add('a-' + act); h.act = act; }
  function place(f, x, y, w, ms) {
    f.root.style.transitionDuration = ms + 'ms';
    f.root.style.left = Math.round(x - w / 2) + 'px'; f.root.style.bottom = Math.round(y) + 'px'; f.root.style.width = Math.round(w) + 'px';
    f.root.style.zIndex = String(1000 - Math.round(y)); f.root.classList.toggle('drive', false);
    f.x = x; f.y = y;
  }
  function walkTo(f, x, y, w, ms, done) {
    clearTimeout(f.t);

  }
  function goScene(f, s, ms) {
    const fx = s.left + s.def.cx * s.k, fy = s.bottom + 10 * s.k, w = 44 * s.k;
    const arrive = function () { if (!world) return; showScene(f, s); setAct(f, s.def.act); f.root.classList.toggle('drive', s.def.act === 'drive'); };
    if (!ms) { place(f, fx, fy, w, 0); arrive(); return; }
    walkTo(f, fx, fy, w, ms, arrive);
  }

  function say(h, text, ms) {
    clearTimeout(h.sayT);
    if (h.say) h.say.remove();
    const b = el('div', 'bd-say', text);
    h.root.append(b); h.say = b;
    const r = b.getBoundingClientRect(), vw = window.innerWidth;
    if (r.left < 6) b.style.marginLeft = (6 - r.left) + 'px'; else if (r.right > vw - 6) b.style.marginLeft = (vw - 6 - r.right) + 'px';

  }
  function poke(h, lines) {
    h.inn.classList.remove('jump'); void h.inn.offsetWidth;
    h.inn.classList.add('jump'); h.root.classList.add('hearts');
    setTimeout(function () { h.inn.classList.remove('jump'); h.root.classList.remove('hearts'); }, 1250);
    say(h, pick(lines || TAP), 1900);
  }

  /* every 30 seconds the townsfolk leave what they are doing and meet near the road to gossip about the walker */
  function startGather() {
    clearTimeout(gatherT);
    gatherT = setTimeout(startGather, 30000);
    if (!world || gathering || cheerLock || document.hidden || calm() || folk.length < 2) return;
    gathering = true;
    const cx = WW / 2, w = PH ? 44 : 58;
    folk.forEach(function (f, i) {
      removeScene(f);
      const side = i % 2 ? 1 : -1, step = Math.floor(i / 2);
      const x = cx + side * (ROAD * 0.62 + w * 0.7 + step * (w + 8)), y = 5 + (i % 2) * 7;
      walkTo(f, x, y, w, 2600 + i * 250, function () { f.inn.classList.toggle('flip', side > 0); setAct(f, 'chat'); });
    });
    const order = folk.slice().sort(function () { return Math.random() - 0.5; });
    order.forEach(function (f, j) { setTimeout(function () { if (gathering && world) say(f, pick(GOSSIP), 2300); }, 3400 + j * 1800); });
    setTimeout(disperse, 3400 + order.length * 1800 + 1500);
  }
  function disperse() {
    if (!gathering || !world) return;
    const sl = slots().sort(function () { return Math.random() - 0.5; }), used = [];
    folk.forEach(function (f, i) {
      f.inn.classList.remove('flip');
      const s = sceneFor(f, sl[i % sl.length], used); used.push(s.def.name);
      goScene(f, s, 2800 + i * 300);
    });
    setTimeout(function () { gathering = false; }, 3800);
  }

  /* the walker: tired grows with the length of the session, but he keeps going */
  function walkerMode() {
    if (!walkerEl) return;
    const st = cur.status, m = st === 'running' ? 'run' : st === 'paused' ? 'rest' : st === 'stopped' ? 'win' : 'idle';
    const e = (m === 'run' || m === 'rest') ? T.elapsed(cur, Date.now()) : 0, t = e > 45 * 60000 ? 2 : e > 15 * 60000 ? 1 : 0;
    const cls = 'w-walker m-' + m + ' t' + t + (cheerLock ? ' cheer' : '');
    if (walkerEl.className !== cls) walkerEl.className = cls;
    world.classList.toggle('still', m !== 'run');
    return m + (m === 'run' ? t : '');
  }
  function spawnLane() {
    const side = (laneTick++ & 1) ? 'R' : 'L', opp = side === 'L' ? 'R' : 'L';
    const t = el('i', 'w-tile'), g = el('i', 'w-tuft');
    t.style.animationName = 'wt' + side; g.style.animationName = 'wf' + opp;
    [t, g].forEach(function (n) { n.addEventListener('animationend', function () { n.remove(); }); laneEl.append(n); });
    while (laneEl.children.length > 36) laneEl.firstChild.remove();
  }
  /* called once a second while the clock runs: one more step of path appears */
  function journeyTick() {
    if (!world) return;
    const key = walkerMode();
    const gms = goal * 60000, tm = todayMs(), done = Math.floor(tm / gms), prog = (tm % gms) / gms;
    goalEl.style.setProperty('--gs', (0.42 + 0.58 * prog).toFixed(3));
    if (lastGoalCount >= 0 && done > lastGoalCount) {
      goalEl.classList.add('hit'); setTimeout(function () { if (goalEl) goalEl.classList.remove('hit'); }, 2000);
      say(wk, 'Goal reached! …the next one?', 3800);
    }
    lastGoalCount = done;
    if (cur.status === 'running' && !document.hidden && !calm()) spawnLane();
    const now = Date.now();
    if (now > nextThought && !calm() && !document.hidden && !wk.say) {
      say(wk, pick(THOUGHTS[key] || THOUGHTS.idle), 3200);
      nextThought = now + rnd(22000, 40000);
    }
  }

  function buildWorld() {
    teardown();
    const g = geo();
    WW = g.w; WH = g.h; PH = g.phone; lastBuilt = [g.left, g.w, g.h, g.phone].join();
    docEl.style.setProperty('--world-h', (buddies ? WH : 0) + 'px');
    document.body.classList.toggle('bd-on', buddies && WH > 0);
    if (!buddies || !WH) return;
    Y0 = Math.round(WH * 0.42); ROAD = Math.min(WW * 0.2, PH ? 66 : 112); FAR = ROAD * 0.17;
    const tw = Math.round(ROAD * 0.62), cx = WW / 2;
    kfEl = el('style'); kfEl.textContent = laneKeyframes(tw); document.head.append(kfEl);

    world.style.left = g.left + 'px'; world.style.width = WW + 'px'; world.style.height = WH + 'px';
    world.style.setProperty('--tw', tw + 'px'); world.style.setProperty('--gw', (PH ? 30 : 44) + 'px');
    const hh = Math.round(WH * 0.3);
    world.innerHTML = '<div class="w-sky"></div>' +
      '<svg class="w-hills" viewBox="0 0 100 40" preserveAspectRatio="none" style="top:' + (Y0 - hh) + 'px;height:' + hh + 'px" aria-hidden="true"><path d="M0 40 V22 Q10 8 24 18 T50 14 T76 20 T100 10 V40z" fill="var(--w-h2)"/><path d="M0 40 V30 Q16 16 34 28 T70 24 T100 30 V40z" fill="var(--w-h1)"/></svg>' +
      '<div class="w-ground" style="top:' + Y0 + 'px"></div>' +
      '<svg class="w-road" width="' + WW + '" height="' + WH + '" viewBox="0 0 ' + WW + ' ' + WH + '" aria-hidden="true"><polygon points="' + (cx - FAR) + ',' + Y0 + ' ' + (cx + FAR) + ',' + Y0 + ' ' + (cx + ROAD) + ',' + WH + ' ' + (cx - ROAD) + ',' + WH + '" fill="var(--w-road)"/><path d="M' + (cx - FAR) + ' ' + Y0 + ' L' + (cx - ROAD) + ' ' + WH + ' M' + (cx + FAR) + ' ' + Y0 + ' L' + (cx + ROAD) + ' ' + WH + '" stroke="var(--w-edge)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>' +
      '<div class="w-goal" style="top:' + (Y0 + 2) + 'px;--gs:.42">' + goalSVG() + '</div><div class="w-lane"></div><div class="w-actors"></div>';
    laneEl = world.querySelector('.w-lane'); actorsEl = world.querySelector('.w-actors'); goalEl = world.querySelector('.w-goal');
    layer.append(world);

    walkerEl = el('div', 'w-walker m-idle t0');
    walkerEl.style.width = Math.round(WH * 0.36) + 'px'; walkerEl.style.zIndex = '990';
    const wi = el('div', 'wk-in'); wi.innerHTML = walkerSVG(); walkerEl.append(wi); actorsEl.append(walkerEl);
    wk = { root: walkerEl, inn: wi, say: null, sayT: 0 };
    walkerEl.addEventListener('click', function () { poke(wk, ['Keep going!', 'I am fine, really', 'Thanks!', 'Almost there…']); });

    const sl = slots(), n = Math.min(sl.length, PH ? 2 : (WW >= 1000 ? 4 : 3)), used = [];
    const kinds = KINDS.slice().sort(function () { return Math.random() - 0.5; }).slice(0, n);
    kinds.forEach(function (kind, i) {

    const wkTotal = days.reduce(function (a, d) { return a + d.ms; }, 0);
    const active = days.filter(function (d) { return d.ms >= 30000; }).length;
    wc.append(bars, labels, el('p', 'ins-note', wkTotal ? 'Total ' + hms(wkTotal) + ' · avg ' + short(active ? wkTotal / active : 0) + ' per active day · dashed line = goal' : 'No focus time yet this week.'));

    /* tag stats */
    const tc = el('div', 'ins-card');
    const head = el('div', 'ins-head'); head.append(el('span', 'ins-title', 'TIME BY TAG'));
    const rg = el('div', 'range'); rg.setAttribute('role', 'group'); rg.setAttribute('aria-label', 'Tag range');
    [['7', '7D'], ['30', '30D'], ['all', 'ALL']].forEach(function (o) {
      const b = el('button', '', o[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(range === o[0]));
      b.addEventListener('click', function () { range = o[0]; renderInsights(); });
      rg.append(b);
    });
    head.append(rg); tc.append(head);
    const cutoff = range === 'all' ? 0 : now - Number(range) * 86400000;
    const tt = {};
    allRuns().forEach(function (r) {
      if (!r.start || r.start < cutoff) return;
      (r.tags || []).forEach(function (t) { const k = t.toLowerCase(); if (!tt[k]) tt[k] = { label: t, ms: 0 }; tt[k].ms += r.total; });
    });
    const rows = Object.keys(tt).map(function (k) { return tt[k]; }).sort(function (a, b) { return b.ms - a.ms; }).slice(0, 6);
    if (!rows.length) tc.append(el('p', 'ins-note', 'Add tags to a run to see where your time goes.'));
    else {
      rows.forEach(function (t) {
        const row = el('div', 'tg-row'), track = el('div', 'tg-track'), bar = el('div', 'tg-bar');
        bar.style.width = Math.max(3, t.ms / rows[0].ms * 100) + '%';
        track.append(bar);
        row.append(el('span', 'tg-name', t.label), track, el('span', 'tg-val', hms(t.ms)));
        tc.append(row);
      });
      tc.append(el('p', 'ins-note', 'A run with several tags counts toward each one.'));
    }
    box.replaceChildren(gc, wc, tc);
  }
  function allRuns() {
    const list = runs.slice();
    if (cur.status === 'running' || cur.status === 'paused') {
      list.push({ name: cur.name || 'Untitled', tags: (cur.tags || []).slice(), start: cur.startedAt, stop: null, total: T.elapsed(cur, Date.now()), mode: cur.mode, target: cur.target, sessions: cur.sessions.slice(), paused: T.pausedTotal(cur, Date.now()), pauses: cur.pauses, live: true });
    }
    return list;
  }
  function streakStats() {
    const days = Array.from(new Set(runs.filter(function (r) { return r.start; }).map(function (r) { return ymd(r.start); }))).sort();
    if (!days.length) return { current: 0, best: 0 };
    const set = new Set(days);
    let best = 0, streak = 0, prev = null;
    days.forEach(function (day) {
      const d = new Date(day + 'T12:00:00');
      const n = d.getTime();
      streak = prev !== null && n - prev === 86400000 ? streak + 1 : 1;
      best = Math.max(best, streak);
      prev = n;
    });
    const today = new Date(); today.setHours(12,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const last = days[days.length - 1];
    let current = 0;
    if (last === ymd(today.getTime()) || last === ymd(yesterday.getTime())) {
      let cursor = new Date(last + 'T12:00:00');
      current = 1;
      while (true) {
        cursor.setDate(cursor.getDate() - 1);
        if (!set.has(ymd(cursor.getTime()))) break;
        current++;
      }
    }
    return { current: current, best: best };
  }
  function renderStreak() {
    const box = $('streakOverview');
    if (!box) return;
    const stats = streakStats();
    box.replaceChildren();
    const current = el('div', 'streak-stat');
    current.append(el('span', 'streak-icon', '✦'), el('strong', '', String(stats.current)), el('small', '', 'DAY STREAK'));
    const best = el('div', 'streak-stat');
    best.append(el('span', 'streak-icon', '↗'), el('strong', '', String(stats.best)), el('small', '', 'BEST STREAK'));
    box.append(current, best);
  }
  function renderHistory() {
    renderStreak(); renderInsights(); renderDataCard();
    const list = allRuns().reverse();
    if (!list.length) {
      runsEl.replaceChildren(el('p', 'empty', 'No sessions yet. Press Start, then End session to save one here. Press Log along the way to mark parts of the session.'));
      return;
    }
    const legend = el('div', 'rn-legend');
    [['study', 'Studied'], ['pause', 'Paused']].forEach(function (k) { const l = el('span'); l.append(el('i', k[0]), k[1]); legend.append(l); });
    const lg = el('span'); lg.append(el('i', 'dot', '1'), 'Log (you pressed Log)'); legend.append(lg, el('span', '', 'Tap Show details for more'));
    const nodes = [legend];
    const groups = [];
    list.forEach(function (r) {
      const k = ymd(r.start);
      if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k: k, items: [], ms: 0 });
      const g = groups[groups.length - 1]; g.items.push(r); g.ms += r.total;
    });
    groups.forEach(function (g) {
      const head = el('div', 'day-head');
      head.append(el('b', '', dayName(g.items[0].start)), el('span', 'day-sum', daySummary(g.ms, g.items.length)));
      const lv = g.items.filter(function (x) { return x.live; })[0];
      if (lv) { head.classList.add('has-live'); head.dataset.base = String(g.ms - lv.total); head.dataset.n = String(g.items.length); }
      nodes.push(head);
      g.items.forEach(function (r) { nodes.push(runEl(r, !!r.live)); });
    });
    runsEl.replaceChildren.apply(runsEl, nodes);
  }
  function openSheet() { renderHistory(); sheet.hidden = false; $('hist').setAttribute('aria-expanded', 'true'); }
  function closeSheet() { sheet.hidden = true; $('hist').setAttribute('aria-expanded', 'false'); }

  let armed = false, armTimer = null;
  function doClear() {
    const b = $('clear');
    if (!armed) {
      armed = true; b.textContent = 'Tap again to clear';
      armTimer = setTimeout(function () { armed = false; b.textContent = 'Clear history'; }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false; b.textContent = 'Clear history';
    runs = []; save(); renderHistory(); renderAll();
    toast('History cleared', { label: 'Undo', fn: function () { const b = readBackups()[0]; if (b) restoreBackup(b); } });
  }

  /* export: real file download (Blob), with the Claude downloads capability used if present */
  let dl = null;
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { dl = d; }).catch(function () { /* ignore */ });
    }
  } catch (e) { /* ignore */ }

  const r4 = function (x) { return Math.round(x * 1e4) / 1e4; };
  async function saveFile(filename, blob) {
    if (dl) {
      try { await dl.save({ filename: filename, data: new Uint8Array(await blob.arrayBuffer()) }); return; }
      catch (e) { if (e && e.code === 'declined') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Downloaded ' + filename);
  }
  const modeName = function (r) { return r.mode === 'down' ? 'Countdown' : 'Stopwatch'; };

  function exportXlsx() {
    const list = allRuns();
    if (!list.length) { toast('Nothing to export yet.'); return; }
    if (typeof XLSX === 'undefined') { toast('Excel library did not load (needs internet). Try CSV.'); return; }
    const runRows = [['Name', 'Tags', 'Mode', 'Start date', 'Start time', 'Stop date', 'Stop time', 'Total (h:mm:ss)', 'Total (hours)', 'Sessions logged', 'Paused (h:mm:ss)', 'Paused (minutes)', 'Pauses']];
    const sessRows = [['Name', 'Start date', 'Session #', 'Duration (h:mm:ss)', 'Duration (hours)', 'Logged at', 'Timer at log (h:mm:ss)']];
    list.forEach(function (r) {
      runRows.push([r.name, (r.tags || []).join('; '), modeName(r), ymd(r.start), clock(r.start), r.stop ? ymd(r.stop) : '', r.stop ? clock(r.stop) : 'running', hms(r.total), r4(r.total / 3600000), r.sessions.length, hms(r.paused || 0), r4((r.paused || 0) / 60000), r.pauses || 0]);
      r.sessions.forEach(function (s) {
        sessRows.push([r.name, ymd(r.start), s.n, hms(s.ms), r4(s.ms / 3600000), clock(s.at), hms(s.elapsed)]);
      });
    });
    const wb = XLSX.utils.book_new();
    const w1 = XLSX.utils.aoa_to_sheet(runRows);
    w1['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 12 }, { wch: 11 }, { wch: 12 }, { wch: 11 }, { wch: 16 }, { wch: 14 }, { wch: 15 }, { wch: 16 }, { wch: 16 }, { wch: 8 }];
    const w2 = XLSX.utils.aoa_to_sheet(sessRows);
    w2['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 10 }, { wch: 18 }, { wch: 16 }, { wch: 11 }, { wch: 22 }];
    XLSX.utils.book_append_sheet(wb, w1, 'Runs');
    XLSX.utils.book_append_sheet(wb, w2, 'Sessions');
    try {
      const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      saveFile('timer-sessions-' + ymd(Date.now()) + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) { toast('Could not create the Excel file.'); }
  }

  const csvCell = function (v) { const t = String(v == null ? '' : v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  function exportCsv() {
    const list = allRuns();
    if (!list.length) { toast('Nothing to export yet.'); return; }
    const rows = [['Name', 'Tags', 'Mode', 'Start date', 'Start time', 'Stop date', 'Stop time', 'Run total (h:mm:ss)', 'Run total (hours)', 'Paused (h:mm:ss)', 'Pauses', 'Session #', 'Session (h:mm:ss)', 'Session (hours)', 'Logged at']];
    list.forEach(function (r) {
      const base = [r.name, (r.tags || []).join('; '), modeName(r), ymd(r.start), clock(r.start), r.stop ? ymd(r.stop) : '', r.stop ? clock(r.stop) : 'running', hms(r.total), r4(r.total / 3600000), hms(r.paused || 0), r.pauses || 0];
      if (!r.sessions.length) rows.push(base.concat(['', '', '', '']));
      else r.sessions.forEach(function (s) { rows.push(base.concat([s.n, hms(s.ms), r4(s.ms / 3600000), clock(s.at)])); });
    });
    const text = '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    saveFile('timer-sessions-' + ymd(Date.now()) + '.csv', new Blob([text], { type: 'text/csv;charset=utf-8' }));
  }

  /* wiring */
  nameEl.addEventListener('input', function () { cur.name = nameEl.value; save(); });
  tagsEl.addEventListener('input', function () {
    cur.tags = tagsEl.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 8);
    save(); renderTagSug();
  });
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') nameEl.blur(); });
  $('hist').addEventListener('click', function () { if (sheet.hidden) openSheet(); else closeSheet(); });
  /* More menu (phones): sound, buddies and fullscreen live in a small popover */
  const utilActions = document.querySelector('.utility-actions'), moreBtn = $('moreBtn');
  function setMenu(open) { utilActions.classList.toggle('menu-open', open); moreBtn.setAttribute('aria-expanded', String(open)); }
  moreBtn.addEventListener('click', function () { setMenu(!utilActions.classList.contains('menu-open')); });
  document.addEventListener('click', function (e) { if (!utilActions.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  /* tap the dimmed area outside the bottom sheet to close it */
  const phoneQuery = window.matchMedia('(max-width:760px) and (min-height:521px)');
  document.addEventListener('click', function (e) {
    if (!e.isTrusted || sheet.hidden || !phoneQuery.matches) return; /* ignore the script-made click that starts a file download */
    if (sheet.contains(e.target) || $('hist').contains(e.target) || toastEl.contains(e.target)) return;
    e.preventDefault(); e.stopPropagation(); closeSheet();
  }, true);
  const fsButton = $('fullscreen');
  function syncFullscreenLabel() {
    const active = !!document.fullscreenElement;
    $('fullLabel').textContent = active ? 'Exit fullscreen' : 'Fullscreen';
    fsButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
  }
  fsButton.addEventListener('click', async function () {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (e) { toast('Fullscreen is not available in this browser.'); }
    syncFullscreenLabel();
  });
  document.addEventListener('fullscreenchange', syncFullscreenLabel);
  mUp.addEventListener('click', function () { setMode('up'); });
  mDown.addEventListener('click', function () { setMode('down'); });
  [sH, sM, sS].forEach(function (i) { i.addEventListener('input', onSet); i.addEventListener('focus', function () { i.select(); }); });
  $('csv').addEventListener('click', exportCsv);
  $('close').addEventListener('click', closeSheet);
  $('clear').addEventListener('click', doClear);
  xl.addEventListener('click', exportXlsx);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (e.code !== 'Space') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON')) return;
    e.preventDefault();
    if (cur.status === 'running') doPause(); else doStart();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { document.title = BASE_TITLE; updateTime(); if (cur.status === 'running') lock(); }
  });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (reg) { swReg = reg; }).catch(function () { /* offline mode unavailable */ });
  }

  load();
  nameEl.value = cur.name || '';
  tagsEl.value = (cur.tags || []).join(', ');
  syncSetter();
  renderAll();
  if (cur.status === 'running') lock();
  setInterval(updateTime, 200);
})();
</script>


<style id="ipad-responsive-overrides">
/* iPad / medium-tablet layout (including 13-inch iPad Pro portrait). */
@media (min-width: 761px) and (max-width: 1199px) {
  .shell {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    height: 100vh;
    height: 100dvh;
  }

  .app {
    width: 100%;
    min-width: 0;
    min-height: 100%;
    padding: clamp(1.25rem, 2.8vw, 2.5rem)
             max(1.5rem, env(safe-area-inset-right, 0px))
             max(1.25rem, env(safe-area-inset-bottom, 0px))
             max(1.5rem, env(safe-area-inset-left, 0px));
  }

  .top {
    width: min(100%, 58rem);
    margin-inline: auto;
    gap: clamp(.55rem, 1.2vh, 1rem);
  }

  .utility-row {
    width: 100%;
    flex-wrap: nowrap;
    justify-content: space-between;
    align-items: center;
  }

  .utility-actions {
    flex-wrap: nowrap;
    justify-content: flex-end;
    gap: .5rem;
  }

  .tag-editor {
    width: min(100%, 36rem);
  }

  .tag-editor input {
    flex: 1 1 15rem;
    width: auto;
    min-width: 10rem;
  }

  .center {
    width: 100%;
    min-width: 0;
    flex: 1 0 auto;
    padding-block: clamp(.75rem, 2vh, 1.75rem);
  }

  .center::before,
  .ring-clock {
    width: min(68cqw, 34rem, 66dvh);
    max-width: 100%;
  }

  #time {
    max-width: 100%;
    font-size: min(calc(142cqw / var(--chars)), 32dvh, 22rem);
  }

  .controls {
    width: min(100%, 58rem);
    margin: 1rem auto 0;
    gap: .65rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls .btn {
    min-height: 2.9rem;
    padding-inline: clamp(1rem, 1.8vw, 1.5rem);
  }

  /* A drawer avoids squeezing the timer column in portrait and split-screen layouts. */
  .sheet {
    position: fixed;
    z-index: 20;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(34rem, 46vw);
    height: 100vh;
    height: 100dvh;
    max-height: 100dvh;
    border-left: 1px solid var(--line);
    border-radius: 1.25rem 0 0 1.25rem;
    padding-top: max(1rem, env(safe-area-inset-top, 0px));
    padding-right: max(1.25rem, env(safe-area-inset-right, 0px));
    padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
    box-shadow: -16px 0 42px rgba(0,0,0,.18);
    overscroll-behavior: contain;
  }

  .sheet-body {
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}

/* Finger-friendly controls and safe-area handling on iPadOS. */
@media (pointer: coarse) and (min-width: 761px) {
  .utility-btn,
  .btn,
  .btn.sm,
  .link,
  .modes button,
  .range button,
  .rn-toggle {
    min-height: 2.75rem;
  }

  .utility-btn,
  .btn,
  .btn.sm,
  .modes button,
  .range button {
    padding-inline: 1rem;
  }

  .setter input,
  .tag-editor input,
  #name,
  .run-edit input,
  .goal-edit input {
    font-size: 16px; /* Prevents iPad Safari from zooming when an input receives focus. */
  }

  button,
  .link,
  input {
    touch-action: manipulation;
  }
}

/* Keep compact split-screen and landscape windows usable without clipping. */
@media (min-width: 761px) and (max-height: 900px) {
  .app { padding-block: max(.75rem, env(safe-area-inset-top, 0px)); }
  .top { gap: .45rem; }
  .center { padding-block: .5rem; }
  #time { font-size: min(calc(132cqw / var(--chars)), 34dvh, 21rem); }
}
</style>
