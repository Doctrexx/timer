/* ── Aesthetic refinement: visual-only layer; timer logic and controls unchanged ── */
:root {
  --bg: #f4f5f0;
  --fg: #18221d;
  --mute: #78847c;
  --line: #dfe5dc;
  --surface: #e9eee7;
  --accent: #39785b;
  --accent-fg: #fffdf8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101713;
    --fg: #edf3ed;
    --mute: #9ba99f;
    --line: #2b3930;
    --surface: #1a251e;
    --accent: #8bc6a2;
    --accent-fg: #102017;
  }
}
:root[data-theme="dark"] {
  --bg: #101713; --fg: #edf3ed; --mute: #9ba99f;
  --line: #2b3930; --surface: #1a251e;
  --accent: #8bc6a2; --accent-fg: #102017;
}
body {
  background:
    radial-gradient(ellipse at 50% 5%, rgba(123, 164, 132, .12), transparent 38%),
    var(--bg);
  letter-spacing: .005em;
}
.app {
  padding: clamp(1rem, 2.5vh, 2rem) clamp(1rem, 3vw, 2.75rem);
}
.top { gap: .85rem; padding-top: .4rem; }

  content: "A LITTLE SPACE TO FOCUS";
  color: var(--mute);
  font-size: .61rem;
  font-weight: 600;
  letter-spacing: .22em;
}
#name {
  font-size: 1.05rem;
  letter-spacing: .015em;
  padding: .65rem .5rem;
  transition: border-color .2s, color .2s;
}
.modes {
  padding: 4px;
  gap: 3px;
  border-color: var(--line);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
}

  height: 2.15rem;
  padding-inline: 1.15rem;
  font-size: .64rem;
  letter-spacing: .12em;
  transition: background .2s, color .2s, transform .2s;
}
.modes button[aria-pressed="true"] {
  box-shadow: 0 2px 8px rgba(25, 55, 37, .14);
}
.center {
  position: relative;
  isolation: isolate;
  gap: .8rem;
}
.center::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: min(76vw, 35rem);
  aspect-ratio: 1;
  border: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--surface) 55%, transparent), transparent 68%);
  pointer-events: none;
}
#time {
  font-weight: 300;
  letter-spacing: -.075em;
  text-shadow: 0 8px 35px rgba(36, 72, 49, .06);
}
#time i { opacity: .24; padding-inline: .035em; }
.status {
  gap: .65rem;
  font-size: .72rem;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.dot { width: .42rem; height: .42rem; }
.last {
  padding: .4rem .8rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  font-size: .68rem;
}
.setter {
  gap: .55rem;
  margin-top: .7rem;
  padding: .65rem .85rem;
  border: 1px solid var(--line);
  border-radius: 1rem;

}

  width: 3.7rem;
  height: 2.6rem;

}

.controls { gap: .65rem; margin-top: 1.35rem; }

  min-height: 2.65rem;

  border-radius: 999px;
  border-color: var(--line);
  background: color-mix(in srgb, var(--surface) 42%, transparent);

  letter-spacing: .13em;
  transition: transform .18s, background .18s, box-shadow .18s, border-color .18s;
}

  padding-inline: 1.6rem;
  background: var(--accent);
  color: var(--accent-fg);
  box-shadow: 0 7px 18px color-mix(in srgb, var(--accent) 22%, transparent);

.foot { padding-bottom: .15rem; }

  border-radius: 999px;
  padding: .7rem 1rem;
  font-size: .65rem;
  letter-spacing: .14em;
  transition: background .2s, color .2s;
}
.link:hover { background: var(--surface); }
.sheet {
  width: min(29rem, 42vw);
  padding-inline: clamp(1rem, 2.2vw, 2rem);
  background: color-mix(in srgb, var(--bg) 94%, var(--surface));

.sheet-head > div { gap: .35rem; }
.btn.sm {
  height: 2.1rem;
  min-height: 2.1rem;
  padding-inline: .8rem;
  font-size: .6rem;
}
.run {
  padding-block: 1.15rem;
  border-top-color: var(--line);
}
.run:first-child { padding-top: .9rem; }
.run-top h3 { font-size: .95rem; letter-spacing: -.015em; }
.run-total { font-size: .95rem; }
.run-when { line-height: 1.55; font-size: .74rem; }
.sess { font-size: .73rem; }
.sess li { gap: .55rem; padding-block: .42rem; border-top-style: solid; }
.empty {
  padding: 2.5rem 1.25rem;
  border: 1px dashed var(--line);
  border-radius: 1rem;
  margin-top: 1.25rem;
  background: color-mix(in srgb, var(--surface) 35%, transparent);
  font-size: .86rem;
}
.sheet-foot { border-top: 1px solid var(--line); }
.toast {
  padding: .75rem 1.1rem;
  border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  box-shadow: 0 10px 30px rgba(0,0,0,.16);

@media (max-width: 760px) {
  .app { padding: 1rem 1rem max(.8rem, env(safe-area-inset-bottom, 0px)); }
  .sheet {
    width: min(29rem, 94vw);
    border-left: 1px solid var(--line);

    box-shadow: -18px 0 50px rgba(0,0,0,.18);
  }
  .sheet-head { padding-top: max(1rem, env(safe-area-inset-top, 0px)); }

}

  .modes button { padding-inline: .8rem; }
  .controls { gap: .45rem; }
  .btn { padding-inline: .9rem; }
  .setter { gap: .35rem; padding-inline: .55rem; }
  .setter input { width: 3.2rem; }
}

/* ── Focus studio additions ── */
.utility-row { width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.eyebrow { color:var(--mute); font-size:.58rem; font-weight:600; letter-spacing:.2em; }
.utility-actions { display:flex; align-items:center; gap:.45rem; }

  letter-spacing:.08em; text-transform:uppercase; cursor:pointer; transition:.2s ease;
}

.tag-editor label { color:var(--mute); font-size:.58rem; font-weight:600; letter-spacing:.16em; }

  min-width:0; width:min(22rem,70%); border:1px solid var(--line); border-radius:999px;
  background:color-mix(in srgb,var(--surface) 60%,transparent); color:var(--fg);
  padding:.55rem .9rem; font: .75rem var(--body); outline:none; transition:border-color .2s,box-shadow .2s;
}
.tag-editor input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent); }
.tag-editor input::placeholder { color:var(--mute); }
.tag-hint { color:var(--mute); font-size:.59rem; opacity:.8; }
.run-tags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.65rem; }
.tag-chip { display:inline-flex; border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line)); color:var(--accent); background:color-mix(in srgb,var(--accent) 9%,transparent); border-radius:999px; padding:.22rem .58rem; font-size:.64rem; }
.session-chart { margin-top:.9rem; padding:.85rem .9rem; border:1px solid var(--line); border-radius:1rem; background:color-mix(in srgb,var(--surface) 38%,transparent); }
.chart-title { color:var(--mute); font-size:.57rem; font-weight:600; letter-spacing:.16em; margin-bottom:.65rem; }
.chart-row { display:grid; grid-template-columns:1.6rem minmax(2rem,1fr) 4.6rem; align-items:center; gap:.55rem; margin:.45rem 0; }
.chart-label { color:var(--mute); font: .65rem var(--display); }
.chart-track { height:.48rem; border-radius:999px; overflow:hidden; background:var(--line); }
.chart-bar { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#d4c99b)); transform-origin:left; animation:bar-arrive .75s cubic-bezier(.2,.8,.2,1) both; }
.chart-value { color:var(--mute); text-align:right; font: .62rem var(--display); }
.gap-note { color:var(--mute); opacity:.8; font-size:.58rem; padding-left:2.2rem; margin:-.1rem 0 .25rem; }
.streak-overview { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; padding:0 0 1rem; border-bottom:1px solid var(--line); }
.streak-stat { display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:.55rem; padding:.75rem .85rem; border:1px solid var(--line); border-radius:1rem; background:color-mix(in srgb,var(--surface) 48%,transparent); }
.streak-icon { grid-row:span 2; display:grid; place-items:center; width:2rem; height:2rem; border-radius:50%; background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); }
.streak-stat strong { font:500 1.2rem var(--display); line-height:1.1; }
.streak-stat small { color:var(--mute); font-size:.55rem; letter-spacing:.13em; }
.app { position:relative; overflow:hidden; }
.app::after {
  content:""; position:absolute; z-index:-1; width:18rem; height:18rem; border-radius:50%;
  right:-8rem; top:18%; pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 12%,transparent),transparent 68%);
  animation:drift 13s ease-in-out infinite alternate;
}
.center::before { animation:halo-breathe 7s ease-in-out infinite; }

.run { animation:rise-in .45s ease both; }

@media (max-width:760px) {
  .utility-row { align-items:flex-start; }
  .eyebrow { padding-top:.7rem; font-size:.5rem; }
  .utility-actions { gap:.3rem; }
  .utility-btn { padding:.5rem .65rem; font-size:.57rem; }

<style>
/* Layout: one full-viewport column. Session name on top, an oversized thin-weight clock centred, a quiet row of small controls beneath it, History at the foot. */
:root {
  --bg: #F2F4F1;
  --fg: #13171A;
  --mute: #5D6862;
  --line: #D5DBD4;
  --surface: #E7EBE6;
  --accent: #1B7F5C;
  --accent-fg: #FFFFFF;
  --display: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1110; --fg: #E9EEEA; --mute: #8D9892; --line: #232E28; --surface: #161C19;
    --accent: #4CD3A0; --accent-fg: #06130E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1110; --fg: #E9EEEA; --mute: #8D9892; --line: #232E28; --surface: #161C19;
  --accent: #4CD3A0; --accent-fg: #06130E; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
.shell { display: flex; height: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.app {
  flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
  container-type: inline-size;
  padding-block: 0.75rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
}

/* name */
.top { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding-top: 0.5rem; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.modes button { border: 0; background: transparent; border-radius: 999px; height: 1.9rem; padding: 0 0.9rem; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.setter { display: flex; gap: 0.75rem; align-items: center; justify-content: center; margin-top: 0.75rem; }
.setter label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--mute); }
.setter input { width: 4.25rem; height: 2.5rem; text-align: center; font-family: var(--display); font-size: 1.125rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; }
.btn.sm { height: 2rem; padding: 0 0.8rem; font-size: 0.6875rem; }
#name {
  width: min(24rem, 100%);
  text-align: center;
  background: transparent;
  border: 0;
  border-bottom: 1px solid transparent;
  padding: 0.5rem 0.25rem;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.01em;
}
#name::placeholder { color: var(--mute); font-weight: 400; }
#name:hover { border-bottom-color: var(--line); }
#name:focus { outline: none; border-bottom-color: var(--accent); }

/* clock */
.center {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-align: center;
}
#time {
  --chars: 8;
  font-family: var(--display);
  font-weight: 300;
  font-size: min(calc(150cqw / var(--chars)), 36vh, 24rem);
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: opacity 0.2s;
}
#time i { font-style: normal; opacity: 0.35; padding: 0 0.02em; }
.app[data-state="stopped"] #time { opacity: 0.5; }
.app[data-state="paused"] #time { opacity: 0.7; }

.status {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.8125rem; color: var(--mute); letter-spacing: 0.02em;
  min-height: 1.25rem;
}
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--mute); flex: none; }
.app[data-state="running"] .dot { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .app[data-state="running"] .dot { animation: none; } }
.last {
  font-family: var(--display); font-size: 0.75rem; color: var(--mute);
  font-variant-numeric: tabular-nums; min-height: 1rem;
}

.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1.25rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  height: 2.5rem; padding: 0 1.1rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
  cursor: pointer;
}
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.count {
  font-family: var(--display); font-size: 0.6875rem; font-weight: 500;
  min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem; border-radius: 999px;
  display: inline-grid; place-items: center;
  background: var(--fg); color: var(--bg); letter-spacing: 0;
}

.foot { display: flex; justify-content: center; padding-bottom: 0.25rem; }
.link {
  background: transparent; border: 0; padding: 0.6rem 0.9rem; cursor: pointer;
  font-size: 0.75rem; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase; color: var(--mute);
}
.link:hover { color: var(--fg); }
.link span { font-family: var(--display); letter-spacing: 0; margin-left: 0.25rem; }

/* history sidebar: docked on wide screens, slide-over drawer on narrow ones */
.sheet {
  width: 26rem; flex: none; height: 100%;
  display: flex; flex-direction: column;
  background: var(--bg); border-left: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) 16px;
}
@media (max-width: 760px) {
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(26rem, 92vw); box-shadow: -12px 0 32px rgba(0,0,0,0.25); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; padding-block: 1rem; }
.sheet-head h2 { margin: 0; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
.sheet-head div { display: flex; gap: 0.4rem; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 1rem; }
.sheet-foot { padding-block: 0.5rem 0.75rem; display: flex; justify-content: flex-end; }
.empty { color: var(--mute); font-size: 0.9375rem; line-height: 1.5; padding-block: 2rem; max-width: 30rem; }

.run { padding-block: 1rem; border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.run-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.run-top h3 { margin: 0; font-size: 1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.run-total { font-family: var(--display); font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

<script>
(function () {
  'use strict';

  /*CORE*/
  const T = {
    fresh: function (name, mode, target) {
      return { name: name || '', tags: [], mode: mode || 'up', target: target == null ? 300000 : target, status: 'idle', startedAt: null, acc: 0, since: null, segStart: 0, sessions: [], stopAt: null, pausedAt: null, pausedMs: 0, pauses: 0 };
    },
    elapsed: function (c, now) { return c.acc + (c.status === 'running' ? now - c.since : 0); },
    closePause: function (c, now) {
      if (c.pausedAt !== null) { c.pausedMs += Math.max(0, now - c.pausedAt); c.pausedAt = null; }
    },
    currentPause: function (c, now) {
      return c.status === 'paused' && c.pausedAt !== null ? Math.max(0, now - c.pausedAt) : 0;
    },
    pausedTotal: function (c, now) { return c.pausedMs + T.currentPause(c, now); },
    start: function (c, now) {
      if (c.status === 'running') return c;
      if (c.status === 'paused') { T.closePause(c, now); c.since = now; c.status = 'running'; return c; }
      const n = T.fresh(c.name, c.mode, c.target);
      n.tags = Array.isArray(c.tags) ? c.tags.slice() : [];
      n.status = 'running'; n.startedAt = now; n.since = now;
      return n;
    },
    pause: function (c, now) {
      if (c.status !== 'running') return c;
      c.acc += now - c.since; c.since = null; c.status = 'paused';
      c.pausedAt = now; c.pauses += 1;
      return c;
    },
    log: function (c, now) {
      if (c.status !== 'running' && c.status !== 'paused') return null;
      const e = T.elapsed(c, now);
      const ms = e - c.segStart;
      if (ms < 1000) return null;
      const s = { n: c.sessions.length + 1, ms: ms, at: now, elapsed: e };
      c.sessions.push(s);
      c.segStart = e;
      return s;
    },
    stop: function (c, now) {
      if (c.status !== 'running' && c.status !== 'paused') return null;
      T.closePause(c, now); /* stopping while paused ends that pause */
      let e = T.elapsed(c, now);
      if (c.mode === 'down') e = Math.min(e, c.target);
      c.acc = e; c.since = null; c.status = 'stopped'; c.stopAt = now;
      return { id: now, name: c.name || 'Untitled', tags: Array.isArray(c.tags) ? c.tags.slice() : [], start: c.startedAt, stop: now, total: e, mode: c.mode, target: c.target, sessions: c.sessions.slice(), paused: c.pausedMs, pauses: c.pauses };
    }
  };
  const pad = function (n) { return String(n).padStart(2, '0'); };
  const parts = function (ms) {
    const s = Math.floor(Math.max(0, ms) / 1000);
    return { h: Math.floor(s / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  };
  const hms = function (ms) { const p = parts(ms); return p.h + ':' + pad(p.m) + ':' + pad(p.s); };
  const hrs = function (ms) { return (ms / 3600000).toFixed(2); };
  const clock = function (t) { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const ymd = function (t) { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  /* friendly length: 42 s, 6 min 12 s, 1 h 05 min */
  const human = function (ms) {
    const s = Math.round(Math.max(0, ms) / 1000);
    if (s < 60) return s + ' s';
    const m = Math.floor(s / 60), r = s % 60;
    if (m < 60) return r ? m + ' min ' + r + ' s' : m + ' min';
    const h = Math.floor(m / 60), mm = m % 60;
    return mm ? h + ' h ' + pad(mm) + ' min' : h + ' h';
  };
  /* the line under the clock about paused time (or null) */
  const breakNote = function (c, now) {
    const times = function (n) { return n + (n === 1 ? ' pause' : ' pauses'); };
    if (c.status === 'paused') {
      const here = 'On pause for ' + human(T.currentPause(c, now));
      return c.pauses > 1 ? here + ' · ' + human(T.pausedTotal(c, now)) + ' paused in total' : here;
    }
    if (c.pauses > 0 && (c.status === 'running' || c.status === 'stopped')) {
      const total = human(T.pausedTotal(c, now));
      return c.status === 'stopped' ? 'Paused for ' + total + ' (' + times(c.pauses) + ')' : 'Paused ' + total + ' so far (' + times(c.pauses) + ')';
    }
    return null;
  };
  /*ENDCORE*/

  const $ = function (id) { return document.getElementById(id); };
  const el = function (tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const KEY = 'quiet-timer-v1';
  let cur = T.fresh('');
  let runs = [];
  let sound = true;    /* clap sound on/off */
  let buddies = true;  /* mascots on/off */
  let goal = 120;      /* daily goal, minutes */
  let range = '7';     /* tag stats range: '7' | '30' | 'all' */

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && d.cur && typeof d.cur.status === 'string') {
        cur = Object.assign(T.fresh(''), d.cur);
        if (!Array.isArray(cur.sessions)) cur.sessions = [];
        if (!Array.isArray(cur.tags)) cur.tags = [];
        if (cur.mode !== 'down') cur.mode = 'up';
        if (typeof cur.pausedMs !== 'number') cur.pausedMs = 0;
        if (typeof cur.pauses !== 'number') cur.pauses = 0;
        if (typeof cur.pausedAt !== 'number') cur.pausedAt = null;
        if (cur.status === 'running' && typeof cur.since !== 'number') cur = T.fresh(cur.name, cur.mode, cur.target);
      }
      if (d && Array.isArray(d.runs)) runs = d.runs;
      if (d && typeof d.buddies === 'boolean') buddies = d.buddies;
      if (d && typeof d.sound === 'boolean') sound = d.sound;
      if (d && typeof d.goal === 'number' && d.goal >= 5) goal = Math.min(1440, d.goal);
    } catch (e) { /* storage unavailable */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ cur: cur, runs: runs, goal: goal, buddies: buddies, sound: sound })); } catch (e) { /* ignore */ }
  }

  const app = $('app'), timeEl = $('time'), hh = $('hh'), mm = $('mm'), ss = $('ss');
  const statusEl = $('status'), lastEl = $('last'), breakEl = $('breakNote'), controls = $('controls'), nameEl = $('name'), tagsEl = $('tags');
  const sheet = $('sheet'), runsEl = $('runs'), xl = $('xl'), toastEl = $('toast');
  const modesEl = $('modes'), mUp = $('mUp'), mDown = $('mDown'), setter = $('setter'), sH = $('sh'), sM = $('sm'), sS = $('sx');

  let toastTimer = null;
  function toast(msg, action) {

    if (action) {

      b.addEventListener('click', function () { toastEl.hidden = true; action.fn(); });
      toastEl.append(b);
    }
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, action ? 6500 : 3200);
  }

  /* keep the screen on while timing; harmless if refused */
  let wl = null;
  async function lock() {
    try {
      if (navigator.wakeLock && !wl && document.visibilityState === 'visible') {

      }
    } catch (e) { wl = null; }
  }

  function beep() {
    try {

    } catch (e) { /* ignore */ }
  }

  /* clap sound (soft, synthesised: no audio files) */
  let actx = null;
  function audio() {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!actx) actx = new C();
      if (actx.state === 'suspended') actx.resume();
      return actx;

    const field = function (label, input) { const l = el('label', '', label); l.append(input); return l; };
    const name = el('input'); name.type = 'text'; name.value = r.name || ''; name.maxLength = 80;
    const tags = el('input'); tags.type = 'text'; tags.value = (r.tags || []).join(', ');
    const mins = el('input'); mins.type = 'number'; mins.min = '1'; mins.max = '1440'; mins.step = '1'; mins.inputMode = 'numeric'; mins.value = String(Math.max(1, Math.round(r.total / 60000)));
    const box = el('div', 'run-edit');
    const btns = el('div', 'row');
    const save1 = el('button', 'btn sm', 'Save'); save1.type = 'button';
    const cancel = el('button', 'btn sm', 'Cancel'); cancel.type = 'button';
    btns.append(save1, cancel);
    box.append(field('Name', name), field('Tags (comma separated)', tags), field('Duration (minutes)', mins), btns);
    const done = function () {
      const m = parseFloat(mins.value);
      if (!(m >= 1 && m <= 1440)) { toast('Duration must be 1–1440 minutes.'); return; }
      r.name = name.value.trim() || 'Untitled';
      r.tags = parseTags(tags.value);
      r.total = Math.round(m * 60000);
      save(); renderHistory(); renderAll(); toast('Run updated');
    };
    save1.addEventListener('click', done);
    cancel.addEventListener('click', function () { renderHistory(); });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); done(); }
      if (e.key === 'Escape') { e.preventDefault(); renderHistory(); }
    });
    art.replaceChildren(box);
    name.focus();
  }
  function updateLiveTotal() {
    const t = runsEl.querySelector('.live-total');
    if (!t) { if (cur.status === 'running' || cur.status === 'paused') renderHistory(); return; }
    const ms = T.elapsed(cur, Date.now());
    t.firstChild.nodeValue = hms(ms);
    t.lastChild.textContent = hrs(ms) + ' h';
  }
  /* ---- smarter data ---- */
  const short = function (ms) {
    if (ms < 30000) return '–';
    return ms >= 3600000 ? (ms / 3600000).toFixed(1) + 'h' : Math.max(1, Math.round(ms / 60000)) + 'm';
  };
  const svgEl = function (tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  };
  function dayTotals() {
    const m = {};
    allRuns().forEach(function (r) { if (r.start) { const k = ymd(r.start); m[k] = (m[k] || 0) + r.total; } });
    return m;
  }
  function todayMs() { return dayTotals()[ymd(Date.now())] || 0; }
  function updateToday() {
    const t = $('today'); if (!t) return;
    const ms = todayMs(), g = goal * 60000;
    t.replaceChildren();
    if (!ms && !runs.length && cur.status === 'idle') { t.textContent = 'Daily goal · ' + short(g); return; }
    t.append('Today ' + hms(ms) + ' · ');
    t.append(el('b', '', ms >= g ? 'goal reached ✓' : Math.round(ms / g * 100) + '% of ' + short(g)));
  }
  function renderTagSug() {
    const box = $('tagsug'); if (!box) return;
    const have = (cur.tags || []).map(function (t) { return t.toLowerCase(); });
    const freq = {};
    runs.forEach(function (r) { (r.tags || []).forEach(function (t) { const k = t.toLowerCase(); if (!freq[k]) freq[k] = { label: t, n: 0 }; freq[k].n++; }); });
    const top = Object.keys(freq).filter(function (k) { return have.indexOf(k) < 0; })
      .sort(function (a, b) { return freq[b].n - freq[a].n; }).slice(0, 6);
    box.replaceChildren.apply(box, top.map(function (k) {
      const b = el('button', '', '+ ' + freq[k].label); b.type = 'button';
      b.addEventListener('click', function () {
        if ((cur.tags || []).length >= 8) { toast('Up to 8 tags.'); return; }
        cur.tags = (cur.tags || []).concat(freq[k].label);
        tagsEl.value = cur.tags.join(', ');
        save(); renderTagSug();
      });
      return b;
    }));
  }
  function renderInsights() {
    const box = $('insights'); if (!box) return;
    const totals = dayTotals(), g = goal * 60000, now = Date.now();
    const tms = totals[ymd(now)] || 0;

    /* goal ring */
    const gc = el('div', 'ins-card goal-card');
    const C = 2 * Math.PI * 26;
    const ring = svgEl('svg', { viewBox: '0 0 64 64', 'class': 'ring', 'aria-hidden': 'true' });
    ring.append(svgEl('circle', { cx: 32, cy: 32, r: 26, 'class': 'ring-bg' }));
    ring.append(svgEl('circle', { cx: 32, cy: 32, r: 26, 'class': 'ring-fg', 'stroke-dasharray': (C * Math.min(1, tms / g)) + ' ' + C, transform: 'rotate(-90 32 32)' }));
    const info = el('div', 'goal-info');
    info.append(el('div', 'ins-title', 'TODAY'), el('strong', '', hms(tms)), el('small', '', tms >= g ? 'Goal reached ✓' : Math.round(tms / g * 100) + '% of daily goal'));
    const ge = el('label', 'goal-edit'); ge.append('Goal');
    const gi = el('input'); gi.type = 'number'; gi.min = '5'; gi.max = '1440'; gi.step = '5'; gi.value = String(goal); gi.setAttribute('aria-label', 'Daily goal in minutes'); gi.inputMode = 'numeric';
    gi.addEventListener('change', function () {
      goal = Math.min(1440, Math.max(5, parseInt(gi.value, 10) || goal));
      save(); renderInsights(); updateToday();
    });
    ge.append(gi, 'min');
    gc.append(ring, info, ge);

    /* last 7 days */
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ key: ymd(d.getTime()), label: d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2), ms: 0 }); }
    days.forEach(function (d) { d.ms = totals[d.key] || 0; });
    const max = Math.max.apply(null, days.map(function (d) { return d.ms; }).concat([g, 1]));
    const wc = el('div', 'ins-card');
    wc.append(el('div', 'ins-head')); wc.firstChild.append(el('span', 'ins-title', 'LAST 7 DAYS'));
    const bars = el('div', 'wk-bars'), labels = el('div', 'wk-labels');
    days.forEach(function (d, i) {
      const b = el('div', 'wk-bar' + (i === 6 ? ' today-bar' : '') + (d.ms < 30000 ? ' wk-zero' : ''));
      b.style.height = (d.ms < 30000 ? 2 : Math.max(4, d.ms / max * 100)) + '%';
      b.title = d.key + ' · ' + hms(d.ms);
      bars.append(b);
      const l = el('span', '', d.label); l.append(el('b', '', short(d.ms))); labels.append(l);
    });
    const gl = el('div', 'wk-goal'); gl.style.bottom = (g / max * 100) + '%'; bars.append(gl);
    const wkTotal = days.reduce(function (a, d) { return a + d.ms; }, 0);
    const active = days.filter(function (d) { return d.ms >= 30000; }).length;
    wc.append(bars, labels, el('p', 'ins-note', wkTotal ? 'Total ' + hms(wkTotal) + ' · avg ' + short(active ? wkTotal / active : 0) + ' per active day · dashed line = goal' : 'No focus time yet this week.'));

    /* tag stats */
    const tc = el('div', 'ins-card');
    const head = el('div', 'ins-head'); head.append(el('span', 'ins-title', 'TIME BY TAG'));
    const rg = el('div', 'range'); rg.setAttribute('role', 'group'); rg.setAttribute('aria-label', 'Tag range');
    [['7', '7D'], ['30', '30D'], ['all', 'ALL']].forEach(function (o) {
      const b = el('button', '', o[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(range === o[0]));
      b.addEventListener('click', function () { range = o[0]; renderInsights(); });
      rg.append(b);
    });
    head.append(rg); tc.append(head);
    const cutoff = range === 'all' ? 0 : now - Number(range) * 86400000;
    const tt = {};
    allRuns().forEach(function (r) {
      if (!r.start || r.start < cutoff) return;
      (r.tags || []).forEach(function (t) { const k = t.toLowerCase(); if (!tt[k]) tt[k] = { label: t, ms: 0 }; tt[k].ms += r.total; });
    });
    const rows = Object.keys(tt).map(function (k) { return tt[k]; }).sort(function (a, b) { return b.ms - a.ms; }).slice(0, 6);
    if (!rows.length) tc.append(el('p', 'ins-note', 'Add tags to a run to see where your time goes.'));
    else {
      rows.forEach(function (t) {
        const row = el('div', 'tg-row'), track = el('div', 'tg-track'), bar = el('div', 'tg-bar');
        bar.style.width = Math.max(3, t.ms / rows[0].ms * 100) + '%';
        track.append(bar);
        row.append(el('span', 'tg-name', t.label), track, el('span', 'tg-val', hms(t.ms)));
        tc.append(row);
      });
      tc.append(el('p', 'ins-note', 'A run with several tags counts toward each one.'));
    }
    box.replaceChildren(gc, wc, tc);
  }
  function allRuns() {
    const list = runs.slice();
    if (cur.status === 'running' || cur.status === 'paused') {
      list.push({ name: cur.name || 'Untitled', tags: (cur.tags || []).slice(), start: cur.startedAt, stop: null, total: T.elapsed(cur, Date.now()), mode: cur.mode, target: cur.target, sessions: cur.sessions.slice(), paused: T.pausedTotal(cur, Date.now()), pauses: cur.pauses, live: true });
    }
    return list;
  }
  function streakStats() {
    const days = Array.from(new Set(runs.filter(function (r) { return r.start; }).map(function (r) { return ymd(r.start); }))).sort();
    if (!days.length) return { current: 0, best: 0 };
    const set = new Set(days);
    let best = 0, streak = 0, prev = null;
    days.forEach(function (day) {
      const d = new Date(day + 'T12:00:00');
      const n = d.getTime();
      streak = prev !== null && n - prev === 86400000 ? streak + 1 : 1;
      best = Math.max(best, streak);
      prev = n;
    });
    const today = new Date(); today.setHours(12,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const last = days[days.length - 1];
    let current = 0;
    if (last === ymd(today.getTime()) || last === ymd(yesterday.getTime())) {
      let cursor = new Date(last + 'T12:00:00');
      current = 1;
      while (true) {
        cursor.setDate(cursor.getDate() - 1);
        if (!set.has(ymd(cursor.getTime()))) break;
        current++;
      }
    }
    return { current: current, best: best };
  }
  function renderStreak() {
    const box = $('streakOverview');
    if (!box) return;
    const stats = streakStats();
    box.replaceChildren();
    const current = el('div', 'streak-stat');
    current.append(el('span', 'streak-icon', '✦'), el('strong', '', String(stats.current)), el('small', '', 'DAY STREAK'));
    const best = el('div', 'streak-stat');
    best.append(el('span', 'streak-icon', '↗'), el('strong', '', String(stats.best)), el('small', '', 'BEST STREAK'));
    box.append(current, best);
  }
  function renderHistory() {
    renderStreak(); renderInsights();
    const list = allRuns().reverse();
    if (!list.length) {
      runsEl.replaceChildren(el('p', 'empty', 'No runs yet. Press Start, then Stop to save a run here. Use Log to mark sessions along the way.'));
      return;
    }
    runsEl.replaceChildren.apply(runsEl, list.map(function (r) { return runEl(r, !!r.live); }));
  }
  function openSheet() { renderHistory(); sheet.hidden = false; $('hist').setAttribute('aria-expanded', 'true'); }
  function closeSheet() { sheet.hidden = true; $('hist').setAttribute('aria-expanded', 'false'); }

  let armed = false, armTimer = null;
  function doClear() {
    const b = $('clear');
    if (!armed) {
      armed = true; b.textContent = 'Tap again to clear';
      armTimer = setTimeout(function () { armed = false; b.textContent = 'Clear history'; }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false; b.textContent = 'Clear history';
    runs = []; save(); renderHistory(); renderAll();
  }

  /* export: real file download (Blob), with the Claude downloads capability used if present */
  let dl = null;
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (d) { dl = d; }).catch(function () { /* ignore */ });
    }
  } catch (e) { /* ignore */ }

  const r4 = function (x) { return Math.round(x * 1e4) / 1e4; };
  async function saveFile(filename, blob) {
    if (dl) {
      try { await dl.save({ filename: filename, data: new Uint8Array(await blob.arrayBuffer()) }); return; }
      catch (e) { if (e && e.code === 'declined') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Downloaded ' + filename);
  }
  const modeName = function (r) { return r.mode === 'down' ? 'Countdown' : 'Stopwatch'; };

  function exportXlsx() {
    const list = allRuns();
    if (!list.length) { toast('Nothing to export yet.'); return; }
    if (typeof XLSX === 'undefined') { toast('Excel library did not load (needs internet). Try CSV.'); return; }
    const runRows = [['Name', 'Tags', 'Mode', 'Start date', 'Start time', 'Stop date', 'Stop time', 'Total (h:mm:ss)', 'Total (hours)', 'Sessions logged', 'Paused (h:mm:ss)', 'Paused (minutes)', 'Pauses']];
    const sessRows = [['Name', 'Start date', 'Session #', 'Duration (h:mm:ss)', 'Duration (hours)', 'Logged at', 'Timer at log (h:mm:ss)']];
    list.forEach(function (r) {
      runRows.push([r.name, (r.tags || []).join('; '), modeName(r), ymd(r.start), clock(r.start), r.stop ? ymd(r.stop) : '', r.stop ? clock(r.stop) : 'running', hms(r.total), r4(r.total / 3600000), r.sessions.length, hms(r.paused || 0), r4((r.paused || 0) / 60000), r.pauses || 0]);
      r.sessions.forEach(function (s) {
        sessRows.push([r.name, ymd(r.start), s.n, hms(s.ms), r4(s.ms / 3600000), clock(s.at), hms(s.elapsed)]);
      });
    });
    const wb = XLSX.utils.book_new();
    const w1 = XLSX.utils.aoa_to_sheet(runRows);
    w1['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 12 }, { wch: 11 }, { wch: 12 }, { wch: 11 }, { wch: 16 }, { wch: 14 }, { wch: 15 }, { wch: 16 }, { wch: 16 }, { wch: 8 }];
    const w2 = XLSX.utils.aoa_to_sheet(sessRows);
    w2['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 10 }, { wch: 18 }, { wch: 16 }, { wch: 11 }, { wch: 22 }];
    XLSX.utils.book_append_sheet(wb, w1, 'Runs');
    XLSX.utils.book_append_sheet(wb, w2, 'Sessions');
    try {
      const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      saveFile('timer-sessions-' + ymd(Date.now()) + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) { toast('Could not create the Excel file.'); }
  }

  const csvCell = function (v) { const t = String(v == null ? '' : v); return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  function exportCsv() {
    const list = allRuns();
    if (!list.length) { toast('Nothing to export yet.'); return; }
    const rows = [['Name', 'Tags', 'Mode', 'Start date', 'Start time', 'Stop date', 'Stop time', 'Run total (h:mm:ss)', 'Run total (hours)', 'Paused (h:mm:ss)', 'Pauses', 'Session #', 'Session (h:mm:ss)', 'Session (hours)', 'Logged at']];
    list.forEach(function (r) {
      const base = [r.name, (r.tags || []).join('; '), modeName(r), ymd(r.start), clock(r.start), r.stop ? ymd(r.stop) : '', r.stop ? clock(r.stop) : 'running', hms(r.total), r4(r.total / 3600000), hms(r.paused || 0), r.pauses || 0];
      if (!r.sessions.length) rows.push(base.concat(['', '', '', '']));
      else r.sessions.forEach(function (s) { rows.push(base.concat([s.n, hms(s.ms), r4(s.ms / 3600000), clock(s.at)])); });
    });
    const text = '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    saveFile('timer-sessions-' + ymd(Date.now()) + '.csv', new Blob([text], { type: 'text/csv;charset=utf-8' }));
  }

  /* wiring */
  nameEl.addEventListener('input', function () { cur.name = nameEl.value; save(); });
  tagsEl.addEventListener('input', function () {
    cur.tags = tagsEl.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 8);
    save(); renderTagSug();
  });
  nameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') nameEl.blur(); });
  $('hist').addEventListener('click', function () { if (sheet.hidden) openSheet(); else closeSheet(); });
  const fsButton = $('fullscreen');
  function syncFullscreenLabel() {
    const active = !!document.fullscreenElement;
    $('fullLabel').textContent = active ? 'Exit fullscreen' : 'Fullscreen';
    fsButton.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
  }
  fsButton.addEventListener('click', async function () {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (e) { toast('Fullscreen is not available in this browser.'); }
    syncFullscreenLabel();
  });
  document.addEventListener('fullscreenchange', syncFullscreenLabel);
  mUp.addEventListener('click', function () { setMode('up'); });
  mDown.addEventListener('click', function () { setMode('down'); });
  [sH, sM, sS].forEach(function (i) { i.addEventListener('input', onSet); i.addEventListener('focus', function () { i.select(); }); });
  $('csv').addEventListener('click', exportCsv);
  $('close').addEventListener('click', closeSheet);
  $('clear').addEventListener('click', doClear);
  xl.addEventListener('click', exportXlsx);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (e.code !== 'Space') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON')) return;
    e.preventDefault();
    if (cur.status === 'running') doPause(); else doStart();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { document.title = BASE_TITLE; updateTime(); if (cur.status === 'running') lock(); }
  });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (reg) { swReg = reg; }).catch(function () { /* offline mode unavailable */ });
  }

  load();
  nameEl.value = cur.name || '';
  tagsEl.value = (cur.tags || []).join(', ');
  syncSetter();
  renderAll();
  if (cur.status === 'running') lock();
  setInterval(updateTime, 200);
})();
</script>

</body></html>
